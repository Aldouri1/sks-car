<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SKS Car | نظام SKS Car لإدارة خدمات السيارات</title>
  <meta name="application-name" content="SKS Car" />
  <meta name="sks-app-version" content="1.3.0" />
  <meta name="sks-build-id" content="20261120130" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SKS Car" />
  <meta name="theme-color" content="#0066FF" />

  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/svg+xml" href="icons/sks-icon.svg" />
  <link rel="manifest" href="manifest.json" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&display=swap" rel="stylesheet" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Cairo', 'sans-serif'] }
        }
      }
    };
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/paho-mqtt.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.3.5/dist/mqtt.min.js"></script>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="min-h-screen antialiased">

  <!-- ========================================================================
       MAIN WORKSPACE (بدون يوزرات أو شاشة تسجيل دخول — يفتح مباشرة)
       ======================================================================== -->
  <div id="app-shell" class="min-h-screen flex no-print">

    <!-- Mobile Backdrop -->
    <div id="sidebar-backdrop" onclick="toggleMobileSidebar(false)" class="fixed inset-0 bg-black/60 z-40 hidden lg:hidden"></div>

    <!-- SIDEBAR WITH SKS CAR LOGO -->
    <aside id="main-sidebar" class="sks-sidebar flex flex-col justify-between shrink-0 min-h-screen">
      <div>
        <div class="p-4 border-b border-slate-800 flex items-center justify-between">
          <div id="sidebar-logo-slot" onclick="switchTab('dashboard')" class="cursor-pointer"></div>
          <button onclick="toggleMobileSidebar(false)" class="lg:hidden text-slate-400 hover:text-white p-1">✕</button>
        </div>

        <nav id="sidebar-nav-list" class="py-4 space-y-1"></nav>
      </div>

      <div class="p-4 border-t border-slate-800 space-y-2">
        <button onclick="openCloudSyncModal('ota')" class="w-full py-2 px-3 rounded-xl bg-amber-500 hover:bg-amber-400 text-[#070b14] text-xs font-black flex items-center justify-between transition shadow">
          <span>🔄 التحديث التلقائي عن بُعد</span>
          <span class="text-[10px] bg-black/15 px-1.5 py-0.5 rounded font-black" dir="ltr">v1.3.0</span>
        </button>
        <button onclick="openCloudSyncModal('cloud')" class="w-full py-2 px-3 rounded-xl bg-[#0066ff] hover:bg-blue-500 text-white text-xs font-extrabold flex items-center justify-between transition shadow">
          <span>☁️ السحابة وتثبيت التطبيق</span>
          <i data-lucide="cloud" class="w-4 h-4"></i>
        </button>
        <a href="SKS-Car.html" download="SKS-Car.html" class="w-full py-2 px-3 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-extrabold flex items-center justify-between transition">
          <span>تحميل ملف البرنامج للواتساب</span>
          <i data-lucide="share-2" class="w-4 h-4"></i>
        </a>
        <button onclick="exportBackupData()" class="w-full py-2 px-3 rounded-xl bg-sky-500/15 hover:bg-sky-600 text-sky-300 hover:text-white text-xs font-bold flex items-center justify-between transition">
          <span>حفظ البيانات لنقلها</span>
          <i data-lucide="download" class="w-4 h-4"></i>
        </button>
        <label class="w-full py-2 px-3 rounded-xl bg-emerald-500/15 hover:bg-emerald-600 text-emerald-300 hover:text-white text-xs font-bold flex items-center justify-between transition cursor-pointer">
          <span>استرجاع بيانات من ملف</span>
          <i data-lucide="upload" class="w-4 h-4"></i>
          <input type="file" accept=".json" onchange="importBackupData(event)" class="hidden" />
        </label>
        <button onclick="toggleSurfaceTheme()" class="w-full py-2 px-3 rounded-xl bg-slate-800/80 hover:bg-slate-800 text-slate-200 text-xs font-bold flex items-center justify-between">
          <span id="surface-theme-label">الوضع الليلي</span>
          <i data-lucide="moon" class="w-4 h-4 text-sky-400"></i>
        </button>
        <button onclick="clearAllSystemData()" class="w-full py-2 px-3 rounded-xl bg-rose-500/15 hover:bg-rose-600 text-rose-300 hover:text-white text-xs font-bold flex items-center justify-between transition">
          <span>تصفير كافة البيانات</span>
          <i data-lucide="trash-2" class="w-4 h-4"></i>
        </button>
      </div>
    </aside>

    <!-- CONTENT AREA -->
    <div class="flex-1 flex flex-col min-w-0">

      <!-- SIMPLE TOP HEADER -->
      <header class="sticky top-0 z-30 bg-[#070b14] text-white px-3 md:px-6 py-2.5 md:py-3 border-b border-slate-800">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-2">
          <div class="flex items-center gap-2 min-w-0">
            <button onclick="toggleMobileSidebar(true)" class="lg:hidden p-2 rounded-xl bg-slate-800 text-sky-400 shrink-0" aria-label="القائمة">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
            <div id="mobile-logo-slot" class="lg:hidden shrink-0"></div>
            <h1 class="hidden md:block text-base lg:text-lg font-black text-white truncate">
              نظام SKS Car لإدارة خدمات السيارات
            </h1>
          </div>

          <div class="flex items-center gap-1.5 sm:gap-2.5 shrink-0">
            <button id="cloud-sync-badge" onclick="openCloudSyncModal()" class="bg-slate-900 border border-emerald-500/40 px-2.5 sm:px-3 py-1.5 rounded-xl flex items-center gap-1.5 text-[11px] sm:text-xs font-extrabold text-emerald-400 hover:border-emerald-400 transition whitespace-nowrap" title="السحابة والمزامنة التلقائية">
              <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0"></span>
              <span class="hidden sm:inline">مزامنة تلقائية</span>
              <span class="sm:hidden">السحابة</span>
            </button>

            <button onclick="switchTab('reception')" class="sks-electric-btn px-3 sm:px-4 py-1.5 sm:py-2 text-[11px] sm:text-xs md:text-sm flex items-center gap-1 whitespace-nowrap">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
              <span>استلام</span>
            </button>
          </div>
        </div>
      </header>

      <!-- OTA REMOTE AUTO-UPDATE READY BANNER -->
      <div id="sks-ota-update-banner" class="hidden bg-gradient-to-l from-[#0066ff] via-sky-600 to-emerald-600 text-white px-4 py-2.5 text-xs font-black flex flex-wrap items-center justify-between gap-2 shadow-lg no-print">
        <div id="sks-ota-banner-text" class="flex items-center gap-2">
          <span>🚀 تم تحميل تحديث جديد للنظام عن بُعد!</span>
        </div>
        <div class="flex items-center gap-2">
          <button type="button" onclick="window.location.reload()" class="px-3.5 py-1.5 rounded-xl bg-white text-[#070b14] hover:bg-amber-300 font-black text-xs shadow">
            ⚡ تطبيق التحديث الآن
          </button>
          <button type="button" onclick="document.getElementById('sks-ota-update-banner')?.classList.add('hidden')" class="px-2 py-1 rounded-lg bg-black/20 hover:bg-black/35 text-white font-black">✕</button>
        </div>
      </div>

      <!-- MAIN VIEW -->
      <main id="main-view-container" class="flex-1 p-3 sm:p-4 md:p-6 max-w-6xl w-full mx-auto mobile-bottom-spacer"></main>
    </div>
  </div>

  <!-- MOBILE & TABLET BOTTOM BAR (ALL 7 TABS ACCURATELY REPRESENTED) -->
  <nav id="mobile-bottom-nav" class="fixed bottom-0 inset-x-0 z-30 bg-[#070b14] text-white border-t border-slate-800 px-0.5 py-1.5 grid grid-cols-7 gap-0.5 lg:hidden no-print">
    <button type="button" data-mobile-tab="dashboard" onclick="switchTab('dashboard')" class="flex flex-col items-center justify-center py-1 rounded-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      <span class="text-[9px] sm:text-[10px] mt-0.5 leading-tight whitespace-nowrap">الرئيسية</span>
    </button>
    <button type="button" data-mobile-tab="reception" onclick="switchTab('reception')" class="flex flex-col items-center justify-center py-1 rounded-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      <span class="text-[9px] sm:text-[10px] mt-0.5 leading-tight whitespace-nowrap">استلام</span>
    </button>
    <button type="button" data-mobile-tab="installments" onclick="switchTab('installments')" class="flex flex-col items-center justify-center py-1 rounded-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/><path d="M8 14h.01"/><path d="M12 14h.01"/><path d="M16 14h.01"/><path d="M8 18h.01"/><path d="M12 18h.01"/></svg>
      <span class="text-[9px] sm:text-[10px] mt-0.5 leading-tight whitespace-nowrap">الأقساط</span>
    </button>
    <button type="button" data-mobile-tab="contracts" onclick="switchTab('contracts')" class="flex flex-col items-center justify-center py-1 rounded-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
      <span class="text-[9px] sm:text-[10px] mt-0.5 leading-tight whitespace-nowrap">العقود</span>
    </button>
    <button type="button" data-mobile-tab="accounting" onclick="switchTab('accounting')" class="flex flex-col items-center justify-center py-1 rounded-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
      <span class="text-[9px] sm:text-[10px] mt-0.5 leading-tight whitespace-nowrap">الحسابات</span>
    </button>
    <button type="button" data-mobile-tab="customers" onclick="switchTab('customers')" class="flex flex-col items-center justify-center py-1 rounded-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
      <span class="text-[9px] sm:text-[10px] mt-0.5 leading-tight whitespace-nowrap">الجهات</span>
    </button>
    <button type="button" data-mobile-tab="billing" onclick="switchTab('billing')" class="flex flex-col items-center justify-center py-1 rounded-xl">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/></svg>
      <span class="text-[9px] sm:text-[10px] mt-0.5 leading-tight whitespace-nowrap">الفواتير</span>
    </button>
  </nav>

  <!-- MODAL -->
  <div id="modal-backdrop" class="fixed inset-0 bg-black/70 z-50 hidden items-center justify-center p-2.5 sm:p-4 no-print">
    <div id="modal-content" class="sks-card max-w-2xl w-full max-h-[92vh] overflow-y-auto"></div>
  </div>

  <!-- FLOATING MINI CALCULATOR (أيقونة حاسبة صغيرة في أسفل الشاشة) -->
  <div id="mini-calc-wrapper" class="fixed bottom-20 lg:bottom-5 left-3 lg:left-5 z-40 no-print" dir="ltr">
    <!-- Calculator Popup Panel -->
    <div id="mini-calc-popup" class="hidden mb-3 w-64 rounded-2xl bg-[#070b14] border border-slate-700/80 shadow-2xl overflow-hidden text-white">
      <div class="px-3.5 py-2.5 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between" dir="rtl">
        <div class="flex items-center gap-1.5 text-xs font-extrabold text-sky-400">
          <i data-lucide="calculator" class="w-4 h-4"></i>
          <span>حاسبة SKS السريعة</span>
        </div>
        <div class="flex items-center gap-1">
          <button type="button" onclick="copyCalcResult()" class="px-2 py-0.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-[10px] font-bold text-slate-300" title="نسخ النتيجة">نسخ</button>
          <button type="button" onclick="toggleMiniCalculator(false)" class="w-6 h-6 rounded-lg bg-slate-800 hover:bg-rose-600 text-slate-300 hover:text-white text-xs font-black flex items-center justify-center">✕</button>
        </div>
      </div>

      <!-- Display -->
      <div class="p-3 bg-[#050811] text-right border-b border-slate-800/80">
        <div id="mini-calc-expr" class="text-[11px] text-slate-400 font-mono min-h-[16px] truncate">&nbsp;</div>
        <div id="mini-calc-display" class="text-2xl font-black text-white font-mono tracking-tight truncate">0</div>
      </div>

      <!-- Keypad -->
      <div class="p-2.5 grid grid-cols-4 gap-1.5 bg-[#0b1220] text-sm font-black select-none">
        <button type="button" onclick="calcInput('C')" class="py-2.5 rounded-xl bg-rose-500/20 hover:bg-rose-600 text-rose-300 hover:text-white transition">C</button>
        <button type="button" onclick="calcInput('BACK')" class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 transition">⌫</button>
        <button type="button" onclick="calcInput('000')" class="py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-sky-400 text-xs transition">000</button>
        <button type="button" onclick="calcInput('/')" class="py-2.5 rounded-xl bg-sky-500/20 hover:bg-sky-500 text-sky-400 hover:text-white transition">÷</button>

        <button type="button" onclick="calcInput('7')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">7</button>
        <button type="button" onclick="calcInput('8')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">8</button>
        <button type="button" onclick="calcInput('9')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">9</button>
        <button type="button" onclick="calcInput('*')" class="py-2.5 rounded-xl bg-sky-500/20 hover:bg-sky-500 text-sky-400 hover:text-white transition">×</button>

        <button type="button" onclick="calcInput('4')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">4</button>
        <button type="button" onclick="calcInput('5')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">5</button>
        <button type="button" onclick="calcInput('6')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">6</button>
        <button type="button" onclick="calcInput('-')" class="py-2.5 rounded-xl bg-sky-500/20 hover:bg-sky-500 text-sky-400 hover:text-white transition">−</button>

        <button type="button" onclick="calcInput('1')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">1</button>
        <button type="button" onclick="calcInput('2')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">2</button>
        <button type="button" onclick="calcInput('3')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">3</button>
        <button type="button" onclick="calcInput('+')" class="py-2.5 rounded-xl bg-sky-500/20 hover:bg-sky-500 text-sky-400 hover:text-white transition">+</button>

        <button type="button" onclick="calcInput('0')" class="col-span-2 py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">0</button>
        <button type="button" onclick="calcInput('.')" class="py-2.5 rounded-xl bg-slate-800/70 hover:bg-slate-700 text-white transition">.</button>
        <button type="button" onclick="calcInput('=')" class="py-2.5 rounded-xl bg-gradient-to-r from-[#0066ff] to-[#00c6ff] hover:opacity-95 text-white shadow-md transition">=</button>
      </div>
    </div>

    <!-- Floating Calculator Trigger Button -->
    <button id="mini-calc-btn" type="button" onclick="toggleMiniCalculator()" class="w-11 h-11 sm:w-12 sm:h-12 rounded-2xl bg-[#070b14] hover:bg-[#0f172a] text-sky-400 border-2 border-sky-500/50 shadow-xl flex items-center justify-center transition transform hover:scale-105" title="آلة حاسبة سريعة">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 sm:w-6 sm:h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
    </button>
  </div>

  <!-- TOAST -->
  <div id="toast-container" class="fixed bottom-32 sm:bottom-20 left-5 z-50 flex flex-col gap-2 max-w-xs w-full pointer-events-none no-print"></div>

  <!-- PRINTABLE OFFICIAL SKS CAR DOCUMENTS -->
  <section id="printable-document-area" class="only-print"></section>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
