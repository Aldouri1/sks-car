  <style>
/* ==========================================================================
   SKS Car - نظام SKS Car لإدارة خدمات السيارات
   Ultra-Clean & Simple UI — Black, Dark Navy, White & Electric Blue
   ========================================================================== */

:root {
  --sks-black: #070b14;
  --sks-navy: #0f172a;
  --sks-electric: #0066ff;
  --sks-electric-light: #00d2ff;
  --sks-white: #ffffff;
  --sks-bg: #f4f7fb;
  --sks-border: #e2e8f0;
  --sks-text: #0f172a;
  --sks-muted: #64748b;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  font-family: 'Cairo', sans-serif;
  background-color: var(--sks-bg);
  color: var(--sks-text);
  direction: rtl;
}

/* Optional Dark Mode */
body.dark-mode {
  --sks-bg: #070b14;
  --sks-white: #111a2e;
  --sks-border: #1e2d4a;
  --sks-text: #f8fafc;
  --sks-muted: #94a3b8;
}

/* Clean White / Navy Cards */
.sks-card {
  background: var(--sks-white);
  border: 1px solid var(--sks-border);
  border-radius: 16px;
  box-shadow: 0 2px 10px rgba(15, 23, 42, 0.04);
}

.sks-subcard {
  background: rgba(15, 23, 42, 0.025);
  border: 1px solid var(--sks-border);
  border-radius: 12px;
}

body.dark-mode .sks-subcard {
  background: #0b1222;
}

/* Buttons */
.sks-electric-btn {
  background: linear-gradient(135deg, #0066ff 0%, #00b4ff 100%);
  color: #ffffff;
  font-weight: 800;
  border: none;
  border-radius: 12px;
  box-shadow: 0 4px 12px rgba(0, 102, 255, 0.25);
  transition: all 0.15s ease;
  cursor: pointer;
}

.sks-electric-btn:hover {
  opacity: 0.95;
  transform: translateY(-1px);
}

.sks-navy-btn {
  background: #0f172a;
  color: #ffffff;
  font-weight: 700;
  border: 1px solid #1e293b;
  border-radius: 12px;
  transition: all 0.15s ease;
  cursor: pointer;
}

.sks-navy-btn:hover {
  background: #1e293b;
}

.sks-light-btn {
  background: var(--sks-white);
  color: var(--sks-text);
  font-weight: 700;
  border: 1px solid var(--sks-border);
  border-radius: 12px;
  transition: all 0.15s ease;
  cursor: pointer;
}

.sks-light-btn:hover {
  border-color: #0066ff;
  color: #0066ff;
}

/* Form Inputs */
.sks-input {
  background: var(--sks-white);
  border: 1.5px solid var(--sks-border);
  color: var(--sks-text);
  border-radius: 12px;
  padding: 0.65rem 0.9rem;
  width: 100%;
  font-size: 0.92rem;
  font-weight: 600;
  transition: border-color 0.15s;
}

.sks-input:focus {
  outline: none;
  border-color: #0066ff;
  box-shadow: 0 0 0 3px rgba(0, 102, 255, 0.12);
}

/* Sidebar (Black & Dark Navy with Electric Blue active indicator) */
.sks-sidebar {
  width: 250px;
  background: linear-gradient(180deg, #070b14 0%, #0f172a 100%);
  color: #ffffff;
  transition: transform 0.25s ease;
  z-index: 45;
}

.sks-nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem 1rem;
  margin: 0.25rem 0.75rem;
  border-radius: 12px;
  color: #cbd5e1;
  font-weight: 700;
  font-size: 0.95rem;
  cursor: pointer;
  transition: all 0.15s ease;
}

.sks-nav-item:hover {
  background: rgba(255, 255, 255, 0.06);
  color: #ffffff;
}

.sks-nav-item.active {
  background: linear-gradient(90deg, #0066ff 0%, #00b4ff 100%);
  color: #ffffff;
  font-weight: 800;
  box-shadow: 0 4px 14px rgba(0, 102, 255, 0.4);
}

/* Clean Tables */
.sks-table-wrap {
  width: 100%;
  overflow-x: auto;
}

.sks-table {
  width: 100%;
  border-collapse: collapse;
}

.sks-table th {
  background: #0f172a;
  color: #ffffff;
  font-weight: 800;
  font-size: 0.82rem;
  padding: 0.85rem 1rem;
  text-align: right;
  white-space: nowrap;
}

.sks-table th:first-child {
  border-top-right-radius: 10px;
}

.sks-table th:last-child {
  border-top-left-radius: 10px;
}

.sks-table td {
  padding: 0.9rem 1rem;
  font-size: 0.9rem;
  border-bottom: 1px solid var(--sks-border);
  vertical-align: middle;
}

.license-plate-badge {
  display: inline-block;
  background: #f8fafc;
  color: #070b14;
  border: 1.5px solid #0f172a;
  border-radius: 6px;
  padding: 0.1rem 0.5rem;
  font-weight: 800;
  font-size: 0.8rem;
  direction: ltr;
}

/* Responsive Sidebar & Mobile Polish (Android / iOS) */
@media (max-width: 1024px) {
  .sks-sidebar {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: 5rem;
    transform: translateX(105%);
  }
  .sks-sidebar.open {
    transform: translateX(0);
  }
  .mobile-bottom-spacer {
    padding-bottom: 5.75rem !important;
  }
  .sks-table-wrap {
    -webkit-overflow-scrolling: touch;
  }
  .sks-table th {
    padding: 0.65rem 0.7rem;
    font-size: 0.75rem;
  }
  .sks-table td {
    padding: 0.65rem 0.7rem;
    font-size: 0.8rem;
  }
  .sks-input {
    font-size: 0.88rem;
    padding: 0.55rem 0.75rem;
  }
}

#mobile-bottom-nav {
  padding-bottom: max(0.35rem, env(safe-area-inset-bottom));
}

/* Print Stylesheet */
.only-print {
  display: none;
}

@media print {
  @page {
    size: A4;
    margin: 10mm;
  }
  html, body {
    background: #ffffff !important;
    color: #070b14 !important;
  }
  .no-print {
    display: none !important;
  }
  .only-print {
    display: block !important;
  }
  .print-doc-shell {
    border: 2px solid #0f172a;
    border-radius: 12px;
    padding: 18px;
    background: #ffffff;
    box-sizing: border-box;
  }
  .print-page-break {
    page-break-before: always;
    break-before: page;
    margin-top: 0 !important;
  }
  .print-header-bar {
    background: #000000 !important;
    color: #ffffff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    border-radius: 10px;
    padding: 14px 20px;
    border-bottom: 4px solid #dc2626;
  }
  .print-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 12px;
  }
  .print-table th {
    background: #0f172a !important;
    color: #ffffff !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    padding: 8px 10px;
    border: 1px solid #0f172a;
  }
  .print-table td {
    padding: 8px 10px;
    border: 1px solid #cbd5e1;
  }
}

/* Clean Collapsible Summary Cards */
details > summary {
  list-style: none;
}
details > summary::-webkit-details-marker {
  display: none;
}

</style>
</head>

function formatCurrency(val) {
  return (Number(val) || 0).toLocaleString('en-US') + ' ' + SKS_BRAND.currency;
}

function calcJobTotals(job) {
  const servicesTotal = (job.services || []).reduce((acc, s) => acc + (Number(s.price) || 0), 0);
  const partsTotal = (job.parts || []).reduce((acc, p) => acc + ((Number(p.qty) || 1) * (Number(p.unitPrice) || 0)), 0);
  const subtotal = servicesTotal + partsTotal;
  const discount = Number(job.discount) || 0;
  const total = Math.max(0, subtotal - discount);
  const paid = Number(job.paidAmount) || 0;
  const remaining = Math.max(0, total - paid);
  return { servicesTotal, partsTotal, subtotal, discount, total, paid, remaining };
}

   ========================================================================== */
const SKS_IDB_NAME = 'SKS_Car_Storage_v1';
const SKS_IDB_STORE = 'state';
let sksIdbReady = false;

function openSksIndexedDB() {
  return new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined') return reject('IndexedDB not supported');
    const req = indexedDB.open(SKS_IDB_NAME, 1);
    req.onupgradeneeded = (ev) => {
      const db = ev.target.result;
      if (!db.objectStoreNames.contains(SKS_IDB_STORE)) {
        db.createObjectStore(SKS_IDB_STORE);
      }
    };
    req.onsuccess = (ev) => {
      sksIdbReady = true;
      resolve(ev.target.result);
    };
    req.onerror = () => reject(req.error);
  });
}

async function saveToIndexedDB(dbObj) {
  try {
    const idb = await openSksIndexedDB();
    return new Promise((resolve) => {
      const tx = idb.transaction(SKS_IDB_STORE, 'readwrite');
      tx.objectStore(SKS_IDB_STORE).put(dbObj, 'main_db');
      tx.oncomplete = () => resolve(true);
      tx.onerror = () => resolve(false);
    });
  } catch (e) {
    return false;
  }
}

async function loadFromIndexedDB() {
  try {
    const idb = await openSksIndexedDB();
    return new Promise((resolve) => {
      const tx = idb.transaction(SKS_IDB_STORE, 'readonly');
      const req = tx.objectStore(SKS_IDB_STORE).get('main_db');
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => resolve(null);
    });
  } catch (e) {
    return null;
  }
}

function saveDatabase(skipRemotePush = false) {
  stripLegacyDemoData(AppState.db);
  AppState.db.brand = SKS_BRAND;
  AppState.db.updatedAt = Date.now();
  lastSyncTimestamp = AppState.db.updatedAt;

  // 1. Always save full database + all high-res vehicle/document photos into IndexedDB (hundreds of MB capacity)
  saveToIndexedDB(AppState.db);

  // 2. Mirror to localStorage for instant synchronous startup
  try {
    localStorage.setItem(SKS_STORAGE_KEY, JSON.stringify(AppState.db));
  } catch (e) {
    if (e && (e.name === 'QuotaExceededError' || String(e).includes('Quota'))) {
      showToast('📦 تم الحفظ في قاعدة البيانات الموسّعة (IndexedDB) — يُنصح بربط الحفظ السحابي الدائم');
    }
  }

  if (!skipRemotePush) {
    pushRealtimeSync();
    schedulePermanentCloudPush();
  }
}

function applyIncomingRemoteDatabase(incomingDb) {
  if (!incomingDb || !Array.isArray(incomingDb.jobCards)) return;

  // If the second computer sends the old 4 hardcoded demo records, reject them and push our clean zeroed state back (throttled)
  if (hasLegacyDemoData(incomingDb)) {
    stripLegacyDemoData(AppState.db);
    if (Date.now() - lastLegacyPurgePush > 8000) {
      lastLegacyPurgePush = Date.now();
      pushRealtimeSync();
    }
    return;
  }

  stripLegacyDemoData(incomingDb);
  ensureAccountingStructures(incomingDb);

  // Deduplicate: If incoming database content is identical to current state, do nothing (prevents stuck toast/flicker loops)
  if (getDbContentHash(incomingDb) === getDbContentHash(AppState.db)) {
    return;
  }

  lastSyncTimestamp = incomingDb.updatedAt || Date.now();
  AppState.db = Object.assign({}, JSON.parse(JSON.stringify(INITIAL_SKS_DATA)), incomingDb);
  ensureAccountingStructures(AppState.db);
  AppState.db.brand = SKS_BRAND;
  saveToIndexedDB(AppState.db);
  try { localStorage.setItem(SKS_STORAGE_KEY, JSON.stringify(AppState.db)); } catch (e) {}

  if (AppState.activeTab !== 'reception') {
    switchTab(AppState.activeTab || 'dashboard');
  }
  showToast('تمت المزامنة التلقائية مع السحابة / الجهاز الآخر 🔄');
}

function pushRealtimeSync() {
  const netDb = JSON.parse(JSON.stringify(AppState.db));
  stripLegacyDemoData(netDb);
  delete netDb.updatedAt;

  const payload = {
    senderId: SKS_CLIENT_ID,
    timestamp: Date.now(),
    db: netDb
  };
  const jsonStr = JSON.stringify(payload);

  if (sksBroadcast) {
    try { sksBroadcast.postMessage(payload); } catch (e) {}
  }

  const room = getSyncRoomId();
  const stateTopicV1 = `sks_car_erp_sync_v1/${room}/state`;
  const stateTopicV2 = `sks_car_erp_sync_clean_v2/${room}/state`;

  // 1. Paho MQTT (local embedded engine)
  if (sksPahoClient && sksCloudConnected) {
    try {
      const m1 = new Paho.MQTT.Message(jsonStr);
      m1.destinationName = stateTopicV1;
      m1.qos = 1;
      m1.retained = true;
      sksPahoClient.send(m1);

      const m2 = new Paho.MQTT.Message(jsonStr);
      m2.destinationName = stateTopicV2;
      m2.qos = 1;
      m2.retained = true;
      sksPahoClient.send(m2);
    } catch (e) {}
  }

  // 2. mqtt.js fallback
  if (sksMqttClient && sksMqttClient.connected) {
    try {
      sksMqttClient.publish(stateTopicV1, jsonStr, { qos: 1, retain: true });
      sksMqttClient.publish(stateTopicV2, jsonStr, { qos: 1, retain: true });
    } catch (e) {}
  }

  if (window.location.protocol.startsWith('http')) {
    fetch('/api/state', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: jsonStr
    }).catch(() => {});
  }
}

function connectPahoEngine() {
  if (typeof Paho === 'undefined' || !Paho.MQTT) return false;
  const room = getSyncRoomId();
  const stateTopicV1 = `sks_car_erp_sync_v1/${room}/state`;
  const stateTopicV2 = `sks_car_erp_sync_clean_v2/${room}/state`;
  const reqTopic = `sks_car_erp_sync_v1/${room}/request`;
  const broker = SKS_BROKERS[sksBrokerIdx % SKS_BROKERS.length];

  try {
    if (sksPahoClient) {
      try { sksPahoClient.disconnect(); } catch (e) {}
    }
    sksPahoClient = new Paho.MQTT.Client(broker.host, broker.port, broker.path, SKS_CLIENT_ID + '_p');

    sksPahoClient.onConnectionLost = () => {
      sksCloudConnected = false;
      sksBrokerIdx = (sksBrokerIdx + 1) % SKS_BROKERS.length;
      setTimeout(connectPahoEngine, 3000);
    };

    sksPahoClient.onMessageArrived = (message) => {
      try {
        const msg = JSON.parse(message.payloadString);
        if (!msg || msg.senderId === SKS_CLIENT_ID) return;
        const topic = message.destinationName;
        if ((topic === stateTopicV1 || topic === stateTopicV2) && msg.db) {
          applyIncomingRemoteDatabase(msg.db);
        } else if (topic === reqTopic) {
          pushRealtimeSync();
        }
      } catch (e) {}
    };

    sksPahoClient.connect({
      useSSL: true,
      timeout: 4,
      keepAliveInterval: 30,
      cleanSession: true,
      onSuccess: () => {
        updateSyncBadgeUI(true);
        try {
          sksPahoClient.subscribe(stateTopicV1, { qos: 1 });
          sksPahoClient.subscribe(stateTopicV2, { qos: 1 });
          sksPahoClient.subscribe(reqTopic, { qos: 1 });
          pushRealtimeSync();
        } catch (e) {}
      },
      onFailure: () => {
        sksBrokerIdx = (sksBrokerIdx + 1) % SKS_BROKERS.length;
        setTimeout(connectPahoEngine, 2500);
      }
    });
    return true;
  } catch (e) {
    return false;
  }
}

function initRealtimeSync() {
  updateSyncBadgeUI(true);

  if (sksBroadcast) {
    sksBroadcast.onmessage = (ev) => {
      if (ev.data && ev.data.senderId !== SKS_CLIENT_ID && ev.data.db) {
        applyIncomingRemoteDatabase(ev.data.db);
      }
    };
  }

  window.addEventListener('storage', (e) => {
    if (e.key === SKS_STORAGE_KEY && e.newValue) {
      try {
        applyIncomingRemoteDatabase(JSON.parse(e.newValue));
      } catch (err) {}
    }
  });

  if (window.location.protocol.startsWith('http')) {
    setInterval(async () => {
      try {
        const res = await fetch('/api/state', { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          if (data && data.senderId && data.senderId !== SKS_CLIENT_ID && data.db) {
            applyIncomingRemoteDatabase(data.db);
          }
        }
      } catch (e) {}
    }, 2000);
  }

  // Primary: Local Embedded Paho MQTT with multi-broker failover
  const pahoStarted = connectPahoEngine();

  // Secondary fallback: mqtt.js if loaded and Paho wasn't used
  if (!pahoStarted && typeof mqtt !== 'undefined') {
    const room = getSyncRoomId();
    const stateTopicV1 = `sks_car_erp_sync_v1/${room}/state`;
    const stateTopicV2 = `sks_car_erp_sync_clean_v2/${room}/state`;
    const reqTopic = `sks_car_erp_sync_v1/${room}/request`;

    try {
      sksMqttClient = mqtt.connect('wss://broker.emqx.io:8084/mqtt', {
        clientId: SKS_CLIENT_ID,
        clean: true,
        connectTimeout: 4000,
        reconnectPeriod: 3000
      });

      sksMqttClient.on('connect', () => {
        updateSyncBadgeUI(true);
        sksMqttClient.subscribe([stateTopicV1, stateTopicV2, reqTopic], { qos: 1 }, (err) => {
          if (!err) pushRealtimeSync();
        });
      });

      sksMqttClient.on('message', (topic, messageBuffer) => {
        try {
          const msg = JSON.parse(messageBuffer.toString());
          if (!msg || msg.senderId === SKS_CLIENT_ID) return;
          if ((topic === stateTopicV1 || topic === stateTopicV2) && msg.db) {
            applyIncomingRemoteDatabase(msg.db);
          } else if (topic === reqTopic) {
            pushRealtimeSync();
          }
        } catch (e) {}
      });
    } catch (e) {}
  }
}

function normalizeFirebaseUrl(raw) {
  let s = String(raw || '').trim().replace(/^["']|["']$/g, '');
  if (!s) return { ok: false, error: 'يرجى إدخال رابط Firebase Realtime Database أولاً.' };

  if (s.includes('console.firebase.google.com')) {
    if (s.includes('/firestore')) {
      return {
        ok: false,
        error: '⚠️ هذا رابط <strong>Cloud Firestore</strong> وليس <strong>Realtime Database</strong>!<br/>من قائمة Firebase اليسرى اختر <strong>Build ⬅ Realtime Database ⬅ Create Database</strong> ثم انسخ الرابط الذي ينتهي بـ <code>.firebaseio.com</code> أو <code>.firebasedatabase.app</code>.'
      };
    }
    const dbMatch = s.match(/\/database\/([^/?#]+)/i);
    if (dbMatch && dbMatch[1] && dbMatch[1] !== 'data') {
      const dbName = dbMatch[1];
      return {
        ok: true,
        url: `https://${dbName}.firebaseio.com`,
        candidates: [
          `https://${dbName}.firebaseio.com`,
          `https://${dbName}.europe-west1.firebasedatabase.app`,
          `https://${dbName}.asia-southeast1.firebasedatabase.app`
        ],
        autoFixed: true
      };
    }
    return {
      ok: false,
      error: '⚠️ لقد نسخت رابط لوحة التحكم (<code>console.firebase.google.com</code>) بدلاً من رابط قاعدة البيانات!<br/>انسخ الرابط الظاهر داخل صفحة <strong>Realtime Database</strong> بالأعلى (يبدأ بـ <code>https://</code> وينتهي بـ <code>.firebaseio.com</code> أو <code>.firebasedatabase.app</code>).'
    };
  }

  if (!/^https?:\/\//i.test(s)) {
    s = 'https://' + s;
  }

  try {
    const u = new URL(s);
    const host = u.hostname.toLowerCase();
    if (!host.includes('firebaseio.com') && !host.includes('firebasedatabase.app')) {
      return {
        ok: false,
        error: `⚠️ الرابط المُدخل (<code>${host}</code>) ليس رابط Firebase Realtime Database!<br/>الرابط الصحيح ينتهي بـ <code>.firebaseio.com</code> أو <code>.firebasedatabase.app</code>.`
      };
    }
    return { ok: true, url: u.origin, candidates: [u.origin], autoFixed: false };
  } catch (e) {
    return { ok: false, error: '⚠️ صيغة الرابط غير صالحة — تأكد من نسخ الرابط بشكل صحيح بدون مسافات.' };
  }
}

function normalizeSupabaseUrl(raw) {
  let s = String(raw || '').trim().replace(/^["']|["']$/g, '');
  if (!s) return { ok: false, error: 'يرجى إدخال رابط مشروع Supabase أولاً.' };

  // Auto-fix if user pasted Supabase dashboard URL: https://supabase.com/dashboard/project/<ref>/...
  const dashMatch = s.match(/supabase\.com\/dashboard\/project\/([a-z0-9_-]+)/i);
  if (dashMatch && dashMatch[1]) {
    return { ok: true, url: `https://${dashMatch[1]}.supabase.co`, autoFixed: true };
  }

  if (!/^https?:\/\//i.test(s)) {
    s = 'https://' + s;
  }

  try {
    const u = new URL(s);
    if (!u.hostname.toLowerCase().includes('supabase.co')) {
      return {
        ok: false,
        error: `⚠️ الرابط المُدخل (<code>${u.hostname}</code>) ليس رابط API الخاص بـ Supabase!<br/>الرابط الصحيح من <strong>Project Settings ⬅ API ⬅ Project URL</strong> وينتهي بـ <code>.supabase.co</code>.`
      };
    }
    return { ok: true, url: u.origin, autoFixed: false };
  } catch (e) {
    return { ok: false, error: '⚠️ صيغة رابط Supabase غير صالحة.' };
  }
}

async function pushToPermanentCloudDB(showFeedback = false) {
  const cfg = showFeedback ? syncCloudFormInputsToConfigIfOpen() : getCloudDbConfig();
  if (cfg.provider === 'none') {
    if (showFeedback) {
      setCloudDiagStatus('info', 'النظام مضبوط حالياً على الوضع المحلي فقط. اختر Firebase أو Supabase من القائمة أعلاه.');
      showToast('يرجى اختيار وربط Firebase أو Supabase أولاً');
    }
    return false;
  }

  const centerId = (cfg.centerId || 'sks-car-main').replace(/[^a-zA-Z0-9_-]/g, '_');
  const payload = {
    senderId: SKS_CLIENT_ID,
    updatedAt: AppState.db.updatedAt || Date.now(),
    savedAtDisplay: formatDateTimeDisplay(getLocalDateTimeValue(0)),
    db: AppState.db
  };

  if (showFeedback) {
    setCloudDiagStatus('info', '⏳ جارٍ الاتصال بالسحابة ورفع البيانات...');
  }

  try {
    if (cfg.provider === 'firebase') {
      const norm = normalizeFirebaseUrl(cfg.firebaseUrl);
      if (!norm.ok) {
        if (showFeedback) {
          setCloudDiagStatus('error', norm.error);
          showToast('❌ رابط Firebase غير صحيح — راجع الملاحظة داخل النافذة');
        }
        return false;
      }

      const authQuery = cfg.firebaseSecret ? `?auth=${encodeURIComponent(cfg.firebaseSecret.trim())}` : '';
      let lastErr = null;
      let succeededUrl = '';

      for (const candidateBase of norm.candidates) {
        try {
          const endpoint = `${candidateBase}/sks_car_centers/${centerId}.json${authQuery}`;
          const res = await fetch(endpoint, {
            method: 'PUT',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
          });
          if (res.ok) {
            succeededUrl = candidateBase;
            break;
          }
          if (res.status === 401 || res.status === 403) {
            throw new Error('FIREBASE_PERMISSION_DENIED');
          }
          if (res.status === 404) {
            lastErr = new Error('HTTP_404_NOT_FOUND');
            continue;
          }
          throw new Error(`HTTP ${res.status}`);
        } catch (innerErr) {
          lastErr = innerErr;
          if (innerErr.message === 'FIREBASE_PERMISSION_DENIED') throw innerErr;
        }
      }

      if (!succeededUrl) {
        throw lastErr || new Error('Failed to fetch');
      }

      // Save cleaned/auto-fixed URL back to config & input
      cfg.firebaseUrl = succeededUrl;
      const fbInput = document.getElementById('cloud-firebase-url');
      if (fbInput) fbInput.value = succeededUrl;
    } else if (cfg.provider === 'supabase') {
      const norm = normalizeSupabaseUrl(cfg.supabaseUrl);
      if (!norm.ok) {
        if (showFeedback) {
          setCloudDiagStatus('error', norm.error);
          showToast('❌ رابط Supabase غير صحيح — راجع الملاحظة');
        }
        return false;
      }

      cfg.supabaseUrl = norm.url;
      const sbInput = document.getElementById('cloud-supabase-url');
      if (sbInput) sbInput.value = norm.url;

      const apiKey = (cfg.supabaseKey || '').trim();
      const table = (cfg.supabaseTable || 'sks_car_backups').trim();
      if (!apiKey) {
        if (showFeedback) {
          setCloudDiagStatus('error', '⚠️ يرجى إدخال مفتاح <strong>Supabase Anon Public Key</strong> من إعدادات API داخل Supabase.');
          showToast('يرجى إدخال مفتاح Supabase');
        }
        return false;
      }
      const endpoint = `${norm.url}/rest/v1/${table}`;
      const res = await fetch(endpoint, {
        method: 'POST',
        mode: 'cors',
        headers: {
          'Content-Type': 'application/json',
          'apikey': apiKey,
          'Authorization': `Bearer ${apiKey}`,
          'Prefer': 'resolution=merge-duplicates'
        },
        body: JSON.stringify({
          id: centerId,
          updated_at: new Date().toISOString(),
          payload
        })
      });
      if (!res.ok) {
        if (res.status === 401 || res.status === 403) throw new Error('SUPABASE_AUTH_ERROR');
        if (res.status === 404) throw new Error('SUPABASE_TABLE_MISSING');
        throw new Error(`HTTP ${res.status}`);
      }
    }

    cfg.lastCloudPushAt = formatDateTimeDisplay(getLocalDateTimeValue(0));
    saveCloudDbConfigObj(cfg);
    if (showFeedback) {
      setCloudDiagStatus('success', `✅ تم الاتصال والحفظ السحابي بنجاح في (${cfg.lastCloudPushAt})! كافة البيانات والصور والعقود أصبحت محفوظة سحابياً بشكل دائم.`);
      showToast('☁️ تم حفظ كافة البيانات والصور والعقود في السحابة الدائمة بنجاح!');
    }
    return true;
  } catch (err) {
    if (showFeedback) {
      let friendlyMsg = '';
      if (err.message === 'FIREBASE_PERMISSION_DENIED') {
        friendlyMsg = '🔒 <strong>صلاحيات Firebase مغلقة (401/403)!</strong><br/>ادخل إلى تبويب <strong>Rules</strong> داخل Realtime Database في Firebase واجعلها:<br/><code dir="ltr">{ "rules": { ".read": true, ".write": true } }</code> ثم اضغط <strong>Publish</strong>.';
      } else if (err.message === 'HTTP_404_NOT_FOUND') {
        friendlyMsg = '⚠️ <strong>قاعدة البيانات غير موجودة (404)!</strong> تأكد من الضغط على <strong>Create Database</strong> داخل <strong>Realtime Database</strong> ونسخ الرابط الصحيح تماماً (قد يكون بمنطقة أوروبا ينتهي بـ <code>.firebasedatabase.app</code>).';
      } else if (err.message === 'SUPABASE_AUTH_ERROR') {
        friendlyMsg = '🔒 <strong>مفتاح Supabase غير صحيح أو صلاحيات RLS مغلقة!</strong> تأكد من نسخ مفتاح <code>anon public</code> وتشغيل كود SQL كاملاً (يتضمن CREATE POLICY).';
      } else if (err.message === 'SUPABASE_TABLE_MISSING') {
        friendlyMsg = '⚠️ <strong>الجدول غير موجود في Supabase!</strong> اضغط زر <strong>📋 نسخ كود SQL</strong> وشغّله داخل <strong>SQL Editor</strong> في Supabase ثم أعد المحاولة.';
      } else {
        friendlyMsg = `❌ <strong>تعذر الوصول إلى السيرفر السحابي (${err.message}):</strong><br/>1. تأكد من صحة الرابط (في Firebase ينتهي بـ <code>.firebaseio.com</code> أو <code>.firebasedatabase.app</code>، وفي Supabase ينتهي بـ <code>.supabase.co</code>).<br/>2. تأكد من وجود إنترنت فعّال وعدم وجود مانع إعلانات/جدار حماية يحجب الموقع.<br/>3. إذا كنت تفتح ملف <code>SKS-Car.html</code> مباشرة، جرّب فتحه من رابط Netlify أو <code>SKS-Car-App.bat</code>.`;
      }
      setCloudDiagStatus('error', friendlyMsg);
      showToast('❌ تعذر الحفظ السحابي — راجع السبب والحل داخل النافذة');
    }
    return false;
  }
}

async function pullFromPermanentCloudDB(forceApply = false, showFeedback = false) {
  const cfg = showFeedback ? syncCloudFormInputsToConfigIfOpen() : getCloudDbConfig();
  if (cfg.provider === 'none') {
    if (showFeedback) showToast('لم يتم ربط قاعدة بيانات سحابية بعد');
    return false;
  }

  const centerId = (cfg.centerId || 'sks-car-main').replace(/[^a-zA-Z0-9_-]/g, '_');

  if (showFeedback) {
    setCloudDiagStatus('info', '⏳ جارٍ فحص واستعادة البيانات من السحابة...');
  }

  try {
    let remotePayload = null;
    if (cfg.provider === 'firebase') {
      const norm = normalizeFirebaseUrl(cfg.firebaseUrl);
      if (!norm.ok) {
        if (showFeedback) setCloudDiagStatus('error', norm.error);
        return false;
      }
      const authQuery = cfg.firebaseSecret ? `?auth=${encodeURIComponent(cfg.firebaseSecret.trim())}` : '';
      const endpoint = `${norm.url}/sks_car_centers/${centerId}.json${authQuery}`;
      const res = await fetch(endpoint, { mode: 'cors', cache: 'no-store' });
      if (res.status === 401 || res.status === 403) throw new Error('FIREBASE_PERMISSION_DENIED');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      remotePayload = await res.json();
    } else if (cfg.provider === 'supabase') {
      const norm = normalizeSupabaseUrl(cfg.supabaseUrl);
      if (!norm.ok) {
        if (showFeedback) setCloudDiagStatus('error', norm.error);
        return false;
      }
      const apiKey = (cfg.supabaseKey || '').trim();
      const table = (cfg.supabaseTable || 'sks_car_backups').trim();
      if (!apiKey) return false;
      const endpoint = `${norm.url}/rest/v1/${table}?id=eq.${encodeURIComponent(centerId)}&select=*`;
      const res = await fetch(endpoint, {
        mode: 'cors',
        headers: {
          'apikey': apiKey,
          'Authorization': `Bearer ${apiKey}`
        },
        cache: 'no-store'
      });
      if (res.status === 401 || res.status === 403) throw new Error('SUPABASE_AUTH_ERROR');
      if (res.status === 404) throw new Error('SUPABASE_TABLE_MISSING');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const rows = await res.json();
      if (Array.isArray(rows) && rows[0] && rows[0].payload) {
        remotePayload = rows[0].payload;
      }
    }

    if (!remotePayload || !remotePayload.db) {
      if (showFeedback) {
        setCloudDiagStatus('info', '✅ الاتصال بالسحابة ناجح! لكن لا توجد نسخة محفوظة بعد — اضغط «⬆️ رفع نسخة الآن للسحابة».');
        showToast('السحابة متصلة ولكن فارغة — اضغط رفع الآن');
      }
      return false;
    }

    const remoteUpdated = Number(remotePayload.updatedAt || remotePayload.db.updatedAt || 0);
    const localUpdated = Number(AppState.db.updatedAt || 0);

    if (forceApply || (remotePayload.senderId !== SKS_CLIENT_ID && remoteUpdated > localUpdated)) {
      cfg.lastCloudPullAt = formatDateTimeDisplay(getLocalDateTimeValue(0));
      saveCloudDbConfigObj(cfg);

      if (forceApply) {
        AppState.db = Object.assign({}, JSON.parse(JSON.stringify(INITIAL_SKS_DATA)), remotePayload.db);
        ensureAccountingStructures(AppState.db);
        AppState.db.brand = SKS_BRAND;
        saveToIndexedDB(AppState.db);
        try { localStorage.setItem(SKS_STORAGE_KEY, JSON.stringify(AppState.db)); } catch (e) {}
        switchTab(AppState.activeTab || 'dashboard');
        setCloudDiagStatus('success', '✅ تمت استعادة كافة البيانات والصور والعقود من السحابة بنجاح!');
        showToast('✅ تمت استعادة كافة البيانات والصور والعقود من السحابة بنجاح!');
      } else {
        applyIncomingRemoteDatabase(remotePayload.db);
      }
      return true;
    }

    if (showFeedback) {
      setCloudDiagStatus('success', '✅ بياناتك الحالية محدثة ومطابقة تماماً للنسخة المحفوظة في السحابة.');
      showToast('✅ بياناتك الحالية محدثة ومطابقة للنسخة السحابية');
    }
    return true;
  } catch (err) {
    if (showFeedback) {
      let friendlyMsg = err.message === 'FIREBASE_PERMISSION_DENIED'
        ? '🔒 صلاحيات Firebase مغلقة — اجعل Rules في Firebase تساوي <code>".read": true, ".write": true</code>.'
        : `❌ تعذر الاستعادة من السحابة (${err.message}) — تأكد من صحة الرابط والإنترنت وصلاحيات القاعدة.`;
      setCloudDiagStatus('error', friendlyMsg);
      showToast(`❌ تعذر الاستعادة من السحابة (${err.message})`);
    }
    return false;
  }
}

function initPermanentCloudLoop() {
  const cfg = getCloudDbConfig();
  if (cfg.provider !== 'none' && cfg.autoSync) {
    setTimeout(() => pullFromPermanentCloudDB(false, false), 1500);
  }
  setInterval(() => {
    const c = getCloudDbConfig();
    if (c.provider !== 'none' && c.autoSync) {
      pullFromPermanentCloudDB(false, false);
    }
  }, 15000);
}

/* ==========================================================================
   1-E. REMOTE OTA AUTO-UPDATE ENGINE (🔄 التحديث التلقائي عن بُعد للأندرويد والكمبيوتر والآيفون)
   ========================================================================== */
const SKS_APP_VERSION = '1.5.4';
const SKS_BUILD_ID = '20261122154';
const SKS_DEFAULT_OTA_URL = 'https://github.com/Aldouri1/sks-car';
const SKS_OTA_LOCAL_STORAGE_KEY = 'sks_car_ota_local_cfg_v1';

let sksOtaState = {
  loaded: false,
  supported: false,
  platform: 'web',
  bundledVersion: SKS_APP_VERSION,
  activeVersion: SKS_APP_VERSION,
  isUsingOta: false,
  updateUrl: SKS_DEFAULT_OTA_URL,
  autoUpdate: true,
  lastCheckedAt: '',
  lastUpdatedAt: '',
  lastStatus: '',
  lastError: ''
};

function normalizeOtaUrl(raw) {
  let u = String(raw || '').trim();
  if (!u) return '';
  if (!/^https?:\/\//i.test(u)) u = 'https://' + u;
  // Convert github.com/USER/REPO/blob/BRANCH/PATH -> raw.githubusercontent.com/USER/REPO/BRANCH/PATH
  const blobMatch = u.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)$/i);
  if (blobMatch) {
    return `https://raw.githubusercontent.com/${blobMatch[1]}/${blobMatch[2]}/${blobMatch[3]}/${blobMatch[4]}`;
  }
  // Convert github.com/USER/REPO -> raw.githubusercontent.com/USER/REPO/main/SKS-Car.html
  const repoMatch = u.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/?#]+)\/?$/i);
  if (repoMatch) {
    const repoName = repoMatch[2].replace(/\.git$/i, '');
    return `https://raw.githubusercontent.com/${repoMatch[1]}/${repoName}/main/SKS-Car.html`;
  }
  return u;
}

function getLocalOtaFallbackConfig() {
  try {
    const raw = localStorage.getItem(SKS_OTA_LOCAL_STORAGE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      return { updateUrl: parsed.updateUrl || SKS_DEFAULT_OTA_URL, autoUpdate: parsed.autoUpdate !== false };
    }
  } catch (e) {}
  return { updateUrl: SKS_DEFAULT_OTA_URL, autoUpdate: true };
}

function saveLocalOtaFallbackConfig(url, autoUpdate) {
  try {
    localStorage.setItem(SKS_OTA_LOCAL_STORAGE_KEY, JSON.stringify({ updateUrl: url || '', autoUpdate: !!autoUpdate }));
  } catch (e) {}
}

async function fetchOtaStatus() {
  const localCfg = getLocalOtaFallbackConfig();
  if (!window.location.protocol.startsWith('http')) {
    sksOtaState = Object.assign({}, sksOtaState, {
      loaded: true,
      supported: false,
      platform: 'file',
      updateUrl: localCfg.updateUrl || '',
      autoUpdate: localCfg.autoUpdate !== false
    });
    return sksOtaState;
  }
  try {
    const res = await fetch('/api/ota/status?t=' + Date.now(), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    sksOtaState = Object.assign({}, sksOtaState, data, { loaded: true, supported: true });
    if (sksOtaState.updateUrl) {
      saveLocalOtaFallbackConfig(sksOtaState.updateUrl, sksOtaState.autoUpdate);
    }
    return sksOtaState;
  } catch (e) {
    sksOtaState = Object.assign({}, sksOtaState, {
      loaded: true,
      supported: false,
      platform: 'web',
      updateUrl: localCfg.updateUrl || '',
      autoUpdate: localCfg.autoUpdate !== false
    });
    return sksOtaState;
  }
}

function setOtaDiagMessage(type, htmlMsg) {

async function saveOtaSettingsForm(e) {
  if (e) e.preventDefault();
  const rawInput = document.getElementById('ota-update-url')?.value.trim() || '';
  const autoUpdate = !!document.getElementById('ota-auto-update')?.checked;
  const normalized = normalizeOtaUrl(rawInput);

  const urlInputEl = document.getElementById('ota-update-url');
  if (urlInputEl && normalized && normalized !== rawInput) {
    urlInputEl.value = normalized;
  }

  saveLocalOtaFallbackConfig(normalized, autoUpdate);

  if (!sksOtaState.supported) {
    setOtaDiagMessage('warn', '⚠️ أنت تفتح البرنامج حالياً من المتصفح وليس من تطبيق الأندرويد (SKS-Car.apk) أو تطبيق الكمبيوتر (SKS-Car.exe). التحديث التلقائي عن بُعد يعمل داخل التطبيق المثبّت مباشرة.');
    return;
  }

  setOtaDiagMessage('info', '⏳ جاري حفظ رابط التحديث عن بُعد...');
  try {
    const res = await fetch('/api/ota/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updateUrl: normalized, autoUpdate })
    });
    const data = await res.json();
    if (data && data.status) {
      sksOtaState = Object.assign({}, sksOtaState, data.status, { loaded: true, supported: true });
    }
    showToast('تم حفظ إعدادات التحديث التلقائي عن بُعد ✅');
    if (normalized) {
      await checkOtaUpdateNow();
    } else {
      setOtaDiagMessage('warn', 'تم الحفظ. أدخل رابط GitHub أو رابط ملف SKS-Car.html لتفعيل التحديث عن بُعد.');
    }
  } catch (err) {
    setOtaDiagMessage('error', `❌ تعذر حفظ الإعدادات: ${err.message || err}`);
  }
}

async function checkOtaUpdateNow() {
  const rawInput = document.getElementById('ota-update-url')?.value.trim() || sksOtaState.updateUrl || '';
  const autoUpdate = document.getElementById('ota-auto-update') ? !!document.getElementById('ota-auto-update').checked : sksOtaState.autoUpdate;
  const normalized = normalizeOtaUrl(rawInput);

  if (!normalized) {
    setOtaDiagMessage('warn', '⚠️ يرجى إدخال رابط مستودع GitHub أو رابط ملف <code>SKS-Car.html</code> المباشر أولاً.');
    return;
  }
  if (!sksOtaState.supported) {
    setOtaDiagMessage('warn', '⚠️ ميزة التحديث التلقائي عن بُعد تعمل داخل تطبيق الأندرويد (SKS-Car.apk) وتطبيق الكمبيوتر (SKS-Car.exe) وتطبيق الآيفون.');
    return;
  }

  setOtaDiagMessage('info', '⏳ جاري الاتصال بالسيرفر عن بُعد وفحص وجود نسخة أحدث من SKS Car...');
  try {
    // Ensure latest URL is saved first
    await fetch('/api/ota/config', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ updateUrl: normalized, autoUpdate })
    });

    const res = await fetch('/api/ota/check', { method: 'POST' });
    const data = await res.json();
    if (data && data.status) {
      sksOtaState = Object.assign({}, sksOtaState, data.status, { loaded: true, supported: true });
    }

    if (data && data.ok && data.updated) {
      setOtaDiagMessage(
        'success',
        `🎉 <strong>تم تحميل التحديث الجديد عن بُعد بنجاح!</strong> (${data.newVersion ? `الإصدار ${data.newVersion}` : 'نسخة أحدث'})<br/>` +
        `<div class="mt-2"><button type="button" onclick="window.location.reload()" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs shadow">⚡ اضغط هنا لتطبيق التحديث الآن (إعادة تحميل فورية)</button></div>`
      );
      window.onSksOtaUpdateReady(data.newVersion || '');
    } else if (data && data.ok && !data.updated) {
      setOtaDiagMessage('success', `✅ ${data.message || 'تطبيقك محدّث بالفعل ويعمل على أحدث نسخة متوفرة عن بُعد!'} (الإصدار الحالي: ${sksOtaState.activeVersion || SKS_APP_VERSION})`);
      showToast('التطبيق على أحدث نسخة بالفعل ✅');
    } else {
      setOtaDiagMessage('error', `❌ فشل الفحص عن بُعد: ${(data && data.error) || 'تأكد من صحة الرابط واتصال الإنترنت وأن المستودع عام (Public).'}`);
    }
  } catch (err) {
    setOtaDiagMessage('error', `❌ تعذر الاتصال بمحرك التحديث المحلي: ${err.message || err}`);
  }
}

async function resetOtaToBundled() {
  if (!sksOtaState.supported) return;
  if (!confirm('هل تريد العودة إلى النسخة المدمجة الأصلية داخل التطبيق؟ (بياناتك وفواتيرك تبقى محفوظة بالكامل)')) return;
  try {
    await fetch('/api/ota/reset', { method: 'POST' });
    showToast('تمت العودة للنسخة المدمجة — جاري إعادة التحميل...');
    setTimeout(() => window.location.reload(), 450);
  } catch (e) {
    showToast('تعذر الاسترجاع');
  }
}

let activeToastTimer = null;
function showToast(message) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  container.innerHTML = '';
  if (activeToastTimer) clearTimeout(activeToastTimer);

  const el = document.createElement('div');
  el.className = 'pointer-events-auto bg-[#070b14] text-white border-r-4 border-sky-400 px-4 py-3 rounded-xl shadow-lg text-xs font-extrabold flex items-center justify-between gap-2';
  el.innerHTML = `<span>${message}</span><button type="button" onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white font-black px-1">✕</button>`;
  container.appendChild(el);
  activeToastTimer = setTimeout(() => {
    if (el.parentNode) el.remove();
  }, 2600);
}

  initPermanentCloudLoop();
  fetchOtaStatus();

  // Hydrate from high-capacity IndexedDB if it holds a newer or photo-rich state
  loadFromIndexedDB().then((idbState) => {
    if (idbState && Array.isArray(idbState.jobCards)) {
      const idbUpdated = Number(idbState.updatedAt || 0);
      const localUpdated = Number(AppState.db.updatedAt || 0);
      if (idbUpdated > localUpdated || getDbContentHash(idbState) !== getDbContentHash(AppState.db)) {
        if (idbUpdated >= localUpdated && !hasLegacyDemoData(idbState)) {
          AppState.db = Object.assign({}, JSON.parse(JSON.stringify(INITIAL_SKS_DATA)), idbState);
          ensureAccountingStructures(AppState.db);
          AppState.db.brand = SKS_BRAND;
          switchTab(AppState.activeTab || 'dashboard');
        }
      }
    } else {
      saveToIndexedDB(AppState.db);
    }
  }).catch(() => {});
}

function getLocalDateTimeValue(addHours = 0) {
  const d = new Date(Date.now() + addHours * 3600 * 1000);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function formatDateTimeDisplay(val) {
  if (!val) return 'غير محدد';
  return val.replace('T', ' ');
}

function getLocalDateOnlyValue(addDays = 90) {
  const d = new Date(Date.now() + addDays * 24 * 3600 * 1000);
  const pad = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
}

   3-B. EXCEL EXPORT ENGINE & MAINTENANCE REMINDERS & CAR BODY DIAGRAM
   ========================================================================== */
function exportTableToExcelCSV(filename, headers, rows) {
  const escapeCell = (val) => {
    const str = val === null || val === undefined ? '' : String(val).replace(/\r?\n/g, ' ');
    return `"${str.replace(/"/g, '""')}"`;
  };
  const csvLines = [
    headers.map(escapeCell).join(','),
    ...rows.map(row => row.map(escapeCell).join(','))
  ];
  // UTF-8 BOM (\uFEFF) ensures Microsoft Excel opens Arabic text properly
  const csvContent = '\uFEFF' + csvLines.join('\r\n');
  const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${filename}-${new Date().toISOString().slice(0, 10)}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('📊 تم تصدير الجدول إلى ملف Excel بنجاح');
}

function renderCarBodySVGMarkup(damages = [], isInteractive = true, bodyType = selectedVehicleBodyType) {
  const bt = VEHICLE_BODY_TYPES_META[bodyType] ? bodyType : 'sedan';
  const btMeta = VEHICLE_BODY_TYPES_META[bt];
  const markersSvg = (damages || []).map((d, idx) => {
    const meta = DAMAGE_TYPES_META[d.type] || DAMAGE_TYPES_META.scratch;
    const cx = (d.x / 100) * 500;
    const cy = (d.y / 100) * 240;
    return `
      <g class="cursor-pointer" ${isInteractive ? `onclick="event.stopPropagation(); removeBodyDamage(${idx})"` : ''}>
        <circle cx="${cx}" cy="${cy}" r="14" fill="${meta.color}" fill-opacity="0.25" />
        <circle cx="${cx}" cy="${cy}" r="10" fill="${meta.color}" stroke="#ffffff" stroke-width="2" />
        <text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="900" font-family="Cairo, sans-serif">${idx + 1}</text>
      </g>
    `;
  }).join('');

  return `
    <svg
      id="${isInteractive ? 'car-body-damage-svg' : 'car-body-damage-svg-readonly'}"
      viewBox="0 0 500 240"
      class="w-full max-w-[540px] mx-auto select-none ${isInteractive ? 'cursor-crosshair' : ''}"
      ${isInteractive ? 'onclick="handleCarDiagramClick(event)"' : ''}
    >
      <!-- Background Frame -->
      <rect x="0" y="0" width="500" height="240" rx="16" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

      <!-- Vehicle Shape Badge -->

      <text x="423" y="20" text-anchor="middle" fill="#0369a1" font-size="9.5" font-weight="900" font-family="Cairo, sans-serif">${btMeta.label}</text>

      <!-- Direction Labels -->
      <text x="24" y="124" text-anchor="middle" fill="#0066ff" font-size="10.5" font-weight="900" font-family="Cairo, sans-serif">المقدمة</text>
      <text x="476" y="124" text-anchor="middle" fill="#64748b" font-size="10.5" font-weight="900" font-family="Cairo, sans-serif">الخلفية</text>
      <text x="220" y="18" text-anchor="middle" fill="#475569" font-size="10.5" font-weight="800" font-family="Cairo, sans-serif">الجانب الأيمن للمركبة (يمين السائق)</text>
      <text x="250" y="232" text-anchor="middle" fill="#475569" font-size="10.5" font-weight="800" font-family="Cairo, sans-serif">الجانب الأيسر للمركبة (جهة السائق)</text>

      <!-- Vehicle Shape Silhouette -->
      ${getVehicleSilhouetteSVGParts(bt)}

      <!-- Recorded Damage Markers -->
      ${markersSvg}
    </svg>
  `;
}

function setVehicleBodyType(bodyType, isManual = true) {
  if (!VEHICLE_BODY_TYPES_META[bodyType]) return;
  selectedVehicleBodyType = bodyType;
  if (isManual) manualVehicleBodyOverride = true;
  refreshCarBodyInspectorUI();
}

function onReceptionVehicleTitleInput(val) {
  if (manualVehicleBodyOverride) return;
  const detected = detectVehicleBodyTypeFromTitle(val);
  if (detected !== selectedVehicleBodyType) {
    selectedVehicleBodyType = detected;
    refreshCarBodyInspectorUI();
  }
}

function setDamageType(type) {
  selectedDamageType = type;
  refreshCarBodyInspectorUI();
}

function handleCarDiagramClick(e) {
  const svg = document.getElementById('car-body-damage-svg');
  if (!svg) return;
  const rect = svg.getBoundingClientRect();
  const xPercent = Math.round(((e.clientX - rect.left) / rect.width) * 100);
  const yPercent = Math.round(((e.clientY - rect.top) / rect.height) * 100);
  const zoneName = detectCarZoneName(xPercent, yPercent, selectedVehicleBodyType);
  const meta = DAMAGE_TYPES_META[selectedDamageType] || DAMAGE_TYPES_META.scratch;

  receptionBodyDamages.push({
    id: 'DMG-' + Date.now().toString().slice(-5),
    x: Math.max(5, Math.min(95, xPercent)),
    y: Math.max(8, Math.min(92, yPercent)),
    type: meta.id,
    typeLabel: meta.label,
    color: meta.color,
    zoneName,
    note: ''
  });
  refreshCarBodyInspectorUI();
}

function addQuickZoneDamage(zoneName, xPercent, yPercent) {
  const meta = DAMAGE_TYPES_META[selectedDamageType] || DAMAGE_TYPES_META.scratch;
  receptionBodyDamages.push({
    id: 'DMG-' + Date.now().toString().slice(-5),
    x: xPercent,
    y: yPercent,
    type: meta.id,
    typeLabel: meta.label,
    color: meta.color,
    zoneName,
    note: ''
  });
  refreshCarBodyInspectorUI();
}

function removeBodyDamage(idx) {
  receptionBodyDamages.splice(idx, 1);
  refreshCarBodyInspectorUI();
}

function clearBodyDamages() {
  receptionBodyDamages = [];
  refreshCarBodyInspectorUI();
}

function updateBodyDamageNote(idx, val) {
  if (receptionBodyDamages[idx]) {
    receptionBodyDamages[idx].note = val;
  }
}

function ensureMediaOverlayRoot() {
  let root = document.getElementById('sks-media-overlay');
  if (!root) {
    root = document.createElement('div');
    root.id = 'sks-media-overlay';
    root.className = 'fixed inset-0 bg-black/80 z-[70] hidden items-center justify-center p-4 no-print';
    document.body.appendChild(root);
  }
  return root;
}

function closeMediaOverlay() {
  stopLiveCameraStream();
  const root = document.getElementById('sks-media-overlay');
  if (root) {
    root.classList.add('hidden');
    root.classList.remove('flex');
    root.innerHTML = '';
  }
}

function stopLiveCameraStream() {
  if (sksActiveCameraStream) {
    try {
      sksActiveCameraStream.getTracks().forEach(t => t.stop());
    } catch (e) {}
    sksActiveCameraStream = null;
  }
}

function compressImageDataUrl(rawDataUrl, maxSize = 780, quality = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let w = img.width;
      let h = img.height;
      if (w > maxSize || h > maxSize) {
        if (w >= h) {
          h = Math.round((h * maxSize) / w);
          w = maxSize;
        } else {
          w = Math.round((w * maxSize) / h);
          h = maxSize;
        }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, w, h);
      ctx.drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    img.src = rawDataUrl;
  });
}

function compressImageFileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async (ev) => {
      try {
        const compressed = await compressImageDataUrl(ev.target.result);
        resolve(compressed);
      } catch (err) {
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function getAttachmentsArrayForTarget(targetKind, targetId) {
  if (targetKind === 'reception') return receptionAttachments;
  if (targetKind === 'contract_form') return contractFormAttachments;
  if (targetKind === 'job') {
    const job = (AppState.db.jobCards || []).find(j => j.id === targetId);
    if (!job) return null;
    if (!Array.isArray(job.attachments)) job.attachments = [];
    return job.attachments;
  }
  if (targetKind === 'contract') {
    ensureAccountingStructures(AppState.db);
    const tc = (AppState.db.trafficContracts || []).find(c => c.id === targetId);
    if (!tc) return null;
    if (!Array.isArray(tc.attachments)) tc.attachments = [];
    return tc.attachments;
  }
  return null;
}

function refreshAttachmentsUIForTarget(targetKind, targetId) {
  if (targetKind === 'reception') {
    const el = document.getElementById('reception-attachments-wrapper');
    if (el) el.innerHTML = renderAttachmentsManagerCard('reception', '', receptionAttachments, VEHICLE_PHOTO_SLOTS);
    return;
  }
  if (targetKind === 'contract_form') {
    const el = document.getElementById('contract-form-attachments-wrapper');
    if (el) el.innerHTML = renderAttachmentsManagerCard('contract_form', '', contractFormAttachments, CONTRACT_DOC_SLOTS);
    return;
  }
  if (targetKind === 'job') {
    saveDatabase();
    openJobDetailsModal(targetId);
    if (AppState.activeTab === 'dashboard') {
      const mainEl = document.getElementById('main-view-container');
      if (mainEl) mainEl.innerHTML = renderDashboardView();
      if (window.lucide) window.lucide.createIcons();
    }
    return;
  }
  if (targetKind === 'contract') {
    saveDatabase();
    openContractDocsModal(targetId);
    if (AppState.activeTab === 'contracts') {
      const mainEl = document.getElementById('main-view-container');
      if (mainEl) mainEl.innerHTML = renderTrafficContractsView();
      if (window.lucide) window.lucide.createIcons();
    }
  }
}

function saveAttachmentToTarget(targetKind, targetId, slotKey, slotLabel, dataUrl) {
  const arr = getAttachmentsArrayForTarget(targetKind, targetId);
  if (!arr) return;
  const nowStr = formatDateTimeDisplay(getLocalDateTimeValue(0));

  if (slotKey && slotKey !== 'extra') {
    const existingIdx = arr.findIndex(a => a.slotKey === slotKey);
    const record = {
      id: 'ATT-' + Date.now().toString().slice(-6) + Math.floor(Math.random() * 90 + 10),
      slotKey,
      label: slotLabel,
      dataUrl,
      addedAt: nowStr
    };
    if (existingIdx >= 0) {
      arr[existingIdx] = record;
    } else {
      arr.push(record);
    }
  } else {
    arr.push({
      id: 'ATT-' + Date.now().toString().slice(-6) + Math.floor(Math.random() * 90 + 10),
      slotKey: 'extra',
      label: slotLabel || 'صورة / مستمسك إضافي',
      dataUrl,
      addedAt: nowStr
    });
  }

  refreshAttachmentsUIForTarget(targetKind, targetId);
  showToast(`📸 تم إرفاق "${slotLabel}" بنجاح`);
}

function removeAttachmentFromTarget(targetKind, targetId, attId) {
  const arr = getAttachmentsArrayForTarget(targetKind, targetId);
  if (!arr) return;
  const idx = arr.findIndex(a => a.id === attId);
  if (idx >= 0) {
    arr.splice(idx, 1);
    refreshAttachmentsUIForTarget(targetKind, targetId);
    showToast('تم حذف الصورة المرفقة');
  }
}

function triggerPhotoFileUpload(targetKind, targetId, slotKey, slotLabel, useCameraCapture = false, allowMultiple = false) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  if (useCameraCapture) input.setAttribute('capture', 'environment');
  if (allowMultiple) input.multiple = true;

  input.onchange = async (ev) => {
    const files = Array.from(ev.target.files || []);
    if (!files.length) return;
    for (let i = 0; i < files.length; i++) {
      try {
        const compressed = await compressImageFileToDataUrl(files[i]);
        const finalLabel = allowMultiple && files.length > 1 ? `${slotLabel} (${i + 1})` : slotLabel;
        saveAttachmentToTarget(targetKind, targetId, allowMultiple ? 'extra' : slotKey, finalLabel, compressed);
      } catch (err) {
        showToast('تعذر قراءة الصورة المختارة');
      }
    }
  };
  input.click();
}

async function openLiveCameraCapture(targetKind, targetId, slotKey, slotLabel) {
  sksCameraContext = { targetKind, targetId, slotKey, slotLabel };

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    // Fallback cleanly to native mobile camera / file picker
    triggerPhotoFileUpload(targetKind, targetId, slotKey, slotLabel, true, false);
    return;
  }

  const root = ensureMediaOverlayRoot();
  root.innerHTML = `
    <div class="bg-[#070b14] text-white rounded-2xl border border-slate-700 max-w-lg w-full overflow-hidden shadow-2xl">
      <div class="px-4 py-3 border-b border-slate-800 flex items-center justify-between">
        <div>
          <h3 class="text-sm font-black text-sky-400">📸 تصوير بالكاميرا المباشرة</h3>
          <p class="text-xs text-slate-300 font-bold">${slotLabel}</p>
        </div>
        <button type="button" onclick="closeMediaOverlay()" class="w-8 h-8 rounded-xl bg-slate-800 hover:bg-rose-600 text-white font-black">✕</button>
      </div>

      <div class="p-4 space-y-3">
        <div class="relative rounded-xl overflow-hidden bg-black aspect-video flex items-center justify-center border border-slate-700">
          <video id="sks-live-camera-video" autoplay playsinline muted class="w-full h-full object-cover"></video>
          <div id="sks-camera-status" class="absolute inset-0 flex items-center justify-center text-xs font-bold text-slate-300 bg-black/60">
            جارٍ تشغيل الكاميرا...
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-2">
          <button type="button" onclick="captureLiveCameraPhoto()" class="flex-1 sks-electric-btn py-2.5 text-xs font-black">
            📸 التقاط وحفظ الصورة
          </button>
          <button type="button" onclick="switchLiveCameraFacing()" class="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold">
            🔄 تبديل الكاميرا
          </button>
          <button type="button" onclick="fallbackCameraToFilePicker()" class="px-3 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold">
            📁 اختيار ملف
          </button>
        </div>
      </div>
    </div>
  `;
  root.classList.remove('hidden');
  root.classList.add('flex');

  await startLiveCameraStream();
}

async function startLiveCameraStream() {
  stopLiveCameraStream();
  const video = document.getElementById('sks-live-camera-video');
  const statusEl = document.getElementById('sks-camera-status');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: sksCameraFacingMode }, width: { ideal: 1280 }, height: { ideal: 720 } },
      audio: false
    });
    sksActiveCameraStream = stream;
    if (video) {
      video.srcObject = stream;
      await video.play();
    }
    if (statusEl) statusEl.classList.add('hidden');
  } catch (err) {
    if (statusEl) {
      statusEl.innerHTML = `<div class="text-center p-4 space-y-2"><div class="text-amber-400 font-black">⚠️ تعذر الوصول إلى الكاميرا على هذا الجهاز</div><div class="text-[11px] text-slate-300">يمكنك الضغط على «📁 اختيار ملف» لرفع الصورة مباشرة من الحاسبة أو الهاتف</div></div>`;
    }
  }
}

async function switchLiveCameraFacing() {
  sksCameraFacingMode = sksCameraFacingMode === 'environment' ? 'user' : 'environment';
  await startLiveCameraStream();
}

function fallbackCameraToFilePicker() {
  const ctx = sksCameraContext;
  closeMediaOverlay();
  if (ctx) {
    triggerPhotoFileUpload(ctx.targetKind, ctx.targetId, ctx.slotKey, ctx.slotLabel, false, false);
  }
}

async function captureLiveCameraPhoto() {
  const video = document.getElementById('sks-live-camera-video');
  if (!video || !video.videoWidth || !sksCameraContext) {
    showToast('الكاميرا غير جاهزة — استخدم زر اختيار ملف');
    return;
  }
  const canvas = document.createElement('canvas');
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx2d = canvas.getContext('2d');
  ctx2d.drawImage(video, 0, 0, canvas.width, canvas.height);
  const rawUrl = canvas.toDataURL('image/jpeg', 0.9);
  const compressed = await compressImageDataUrl(rawUrl);
  const { targetKind, targetId, slotKey, slotLabel } = sksCameraContext;
  closeMediaOverlay();
  saveAttachmentToTarget(targetKind, targetId, slotKey, slotLabel, compressed);
}

function printSingleAttachment(targetKind, targetId, attId) {
  const arr = getAttachmentsArrayForTarget(targetKind, targetId) || [];

  closeMediaOverlay();
  printAttachmentsSheet(`صورة / مستمسك رسمي — ${att.label}`, `تاريخ الإرفاق: ${att.addedAt || ''}`, [att]);

    showToast('لا توجد صور أو مستمسكات مرفقة للطباعة');
    return;
  }
  const printArea = document.getElementById('printable-document-area');
  if (!printArea) return;

  const isSingle = attachments.length === 1;

  printArea.innerHTML = `
    <div class="print-doc-shell">
      <div class="print-header-bar flex items-center justify-between">
        <div>${renderSksLogo('print')}</div>
        <div style="text-align: left;">
          <div style="font-size: 15pt; font-weight: 900; color: #00E5FF;">${title}</div>
          <div style="font-size: 11pt; font-weight: 800; color: #FFFFFF;">نظام SKS Car لإدارة خدمات السيارات</div>
          <div style="font-size: 9.5pt; color: #cbd5e1; margin-top: 4px;">${subtitle} | عدد المرفقات: <strong>${attachments.length}</strong></div>
        </div>
      </div>

        ${attachments.map((att, idx) => `
          <div style="border: 1.5px solid #cbd5e1; border-radius: 10px; padding: 10px; text-align: center; break-inside: avoid;">
            <div style="font-weight: 900; font-size: 10.5pt; color: #0f172a; margin-bottom: 8px; border-bottom: 1px dashed #cbd5e1; padding-bottom: 4px;">
              ${idx + 1}. ${att.label}
            </div>
            <img src="${att.dataUrl}" style="max-width: 100%; max-height: ${isSingle ? '560px' : '250px'}; object-fit: contain; margin: 0 auto; border-radius: 6px;" />
            ${att.addedAt ? `<div style="font-size: 8.5pt; color: #64748b; margin-top: 6px;" dir="ltr">${att.addedAt}</div>` : ''}

        `).join('')}

  `;

function initSignaturePad() {
  const canvas = document.getElementById('customer-signature-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  sigCanvasState.hasDrawn = false;

  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let drawing = false;

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  };

  const start = (e) => {
    drawing = true;
    sigCanvasState.hasDrawn = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };

  const move = (e) => {
    if (!drawing) return;
    if (e.cancelable) e.preventDefault();
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };

  const stop = () => {
    drawing = false;
  };

  canvas.onmousedown = start;
  canvas.onmousemove = move;
  window.addEventListener('mouseup', stop);

  canvas.ontouchstart = start;
  canvas.ontouchmove = move;
  canvas.ontouchend = stop;
}

function clearSignaturePad() {
  const canvas = document.getElementById('customer-signature-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  sigCanvasState.hasDrawn = false;
}

  const canvas = document.getElementById('customer-signature-canvas');

  const selectedServiceIds = Array.from(document.querySelectorAll('input[name="rec-services"]:checked')).map(el => el.value);
  const services = AppState.db.serviceCatalog
    .filter(s => selectedServiceIds.includes(s.id))
    .map(s => {
      const customPriceEl = document.getElementById('rec-srv-price-' + s.id);
      const finalPrice = customPriceEl ? (Number(customPriceEl.value) || 0) : s.price;

  const complaint = rawComplaint || services.map(s => s.name).join(' + ') || 'خدمة وصيانة';

  const newJobId = 'JC-' + Date.now().toString().slice(-6);

  const rawSubtotal = services.reduce((s, item) => s + (Number(item.price) || 0), 0);

  const newJob = {
    id: newJobId,
    createdAt: nowStr,
    receivedAt,
    deliveryAt,
    signatureText,
    signatureImage,
    vehicleId: 'VEH-' + Date.now().toString().slice(-6),
    plateNumber,
    vehicleTitle,
    vin: 'SKS-' + Math.floor(100000 + Math.random() * 900000),
    customerId: contact.id,
    customerName,
    customerPhone,
    mileageIn,
    vehicleBodyType: selectedVehicleBodyType,
    bodyDamages,
    attachments: JSON.parse(JSON.stringify(receptionAttachments || [])),
    fuelLevel: '50%',
    bayId: 'BAY-01',
    technicianName: 'مركز SKS Car',
    status: 'in_progress',
    priority: 'عادي',
    complaint,
    diagnosis: complaint,
    trafficContract,
    services,
    parts: [],
    discount: 0,
    paidAmount: 0,
    paymentStatus: 'unpaid'
  };

  if (trafficContract) {
    ensureAccountingStructures(AppState.db);
    AppState.db.trafficContracts.unshift({
      id: 'TC-' + Date.now().toString().slice(-6),
      contractNumber: 'MR-' + Date.now().toString().slice(-5),
      date: nowStr,
      customerId: contact.id,
      sellerName: 'مركز SKS Car / الطرف الأول',
      buyerName: customerName,
      buyerPhone: customerPhone,
      vehicleTitle,
      plateNumber,
      vin: newJob.vin,
      amount: rawSubtotal,
      contractText: trafficContract,
      attachments: JSON.parse(JSON.stringify(receptionAttachments || [])),
      jobId: newJobId
    });

  contact.totalVisits = (Number(contact.totalVisits) || 0) + 1;
  if (vehicleTitle) contact.defaultVehicle = vehicleTitle;
  if (plateNumber) contact.defaultPlate = plateNumber;

  AppState.db.jobCards.unshift(newJob);
  AppState.db.vehicles.unshift({
    id: newJob.vehicleId,
    customerId: contact.id,
    customerName,
    plateNumber,
    vin: newJob.vin,
    make: vehicleTitle,
    model: '',
    year: 2024,
    mileage: mileageIn

function syncModalServiceSelection() {
  const sel = document.getElementById('modal-add-service')?.value;
  const priceInput = document.getElementById('modal-service-price');
  const customInput = document.getElementById('modal-custom-service-name');
  if (sel === '__custom__') {
    if (customInput) customInput.focus();
    return;
  }
  const srv = AppState.db.serviceCatalog.find(s => s.id === sel);
  if (srv && priceInput) {
    priceInput.value = srv.price;
  }
}

function updateJobServicePrice(jobId, serviceIdx, newPrice) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  if (!job || !job.services || !job.services[serviceIdx]) return;
  job.services[serviceIdx].price = Math.max(0, Number(newPrice) || 0);
  saveDatabase();
  openJobDetailsModal(jobId);
  switchTab(AppState.activeTab);
}

function removeJobService(jobId, serviceIdx) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  if (!job || !job.services) return;
  job.services.splice(serviceIdx, 1);
  saveDatabase();
  openJobDetailsModal(jobId);
  switchTab(AppState.activeTab);
}

function closeModal() {
  const modalBackdrop = document.getElementById('modal-backdrop');
  if (!modalBackdrop) return;
  modalBackdrop.classList.add('hidden');
  modalBackdrop.classList.remove('flex');
}

function addServiceToJob(jobId) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  if (!job) return;

  const customName = document.getElementById('modal-custom-service-name')?.value.trim();
  const selId = document.getElementById('modal-add-service')?.value;
  const srv = AppState.db.serviceCatalog.find(s => s.id === selId);
  const price = Math.max(0, Number(document.getElementById('modal-service-price')?.value) || 0);

  const finalName = customName || (srv ? srv.name : '');
  if (!finalName) {
    showToast('يرجى اختيار أو كتابة نوع العملية');
    return;
  }

  job.services.push({ name: finalName, price });
  saveDatabase();
  showToast('تمت إضافة العملية بالسعر المحدد');
  openJobDetailsModal(jobId);
  switchTab(AppState.activeTab);
}

function recordJobPayment(jobId) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  const amount = Number(document.getElementById('modal-pay-amount')?.value) || 0;
  const safeId = document.getElementById('modal-pay-safe')?.value || (AppState.db.safes?.[0]?.id || 'SAFE-01');
  if (!job || amount <= 0) return;
  job.paidAmount = (Number(job.paidAmount) || 0) + amount;
  const totals = calcJobTotals(job);
  job.paymentStatus = totals.remaining === 0 ? 'paid' : 'partial';

  const safeObj = (AppState.db.safes || []).find(s => s.id === safeId);
  const dateStr = formatDateTimeDisplay(getLocalDateTimeValue(0));

  AppState.db.invoices.unshift({
    id: 'INV-' + Date.now().toString().slice(-6),
    jobCardId: job.id,
    date: dateStr,
    customerName: job.customerName,
    plateNumber: job.plateNumber,
    vehicleTitle: job.vehicleTitle,
    subtotal: totals.subtotal,
    discount: totals.discount,
    total: totals.total,
    paid: job.paidAmount,
    method: safeObj ? safeObj.name : 'نقدي',
    status: totals.remaining === 0 ? 'مدفوعة بالكامل' : 'مدفوعة جزئياً'
  });

  ensureAccountingStructures(AppState.db);
  AppState.db.transactions.unshift({
    id: 'TRX-' + Date.now().toString().slice(-6),
    type: 'receipt',
    safeId,
    amount,
    party: job.customerName,
    description: `قبض صيانة سيارة ${job.vehicleTitle} (${job.plateNumber}) — أمر ${job.id}`,
    date: dateStr
  });

  saveDatabase();
  showToast('تم تسجيل الدفعة وإيداعها في القاصة بنجاح');
  openJobDetailsModal(jobId);
  switchTab(AppState.activeTab);
}

   8. SIMPLE ACCOUNTING & SAFES (الحسابات والقاصات: قبض، دفع، تسجيل مصاريف، قاصات)
   ========================================================================== */
let accSelectedType = 'receipt'; // 'receipt' | 'payment' | 'expense'
let accFilterSafe = 'all';
let accFilterType = 'all';

const ACC_TYPE_META = {
  receipt: { label: 'سند قبض (وارد)', short: 'قبض', badge: 'bg-emerald-100 text-emerald-800', sign: '+', color: 'text-emerald-600' },
  payment: { label: 'سند دفع (صادر)', short: 'دفع', badge: 'bg-amber-100 text-amber-800', sign: '−', color: 'text-amber-600' },
  expense: { label: 'تسجيل مصاريف', short: 'مصروف', badge: 'bg-rose-100 text-rose-800', sign: '−', color: 'text-rose-600' }
};

function calcSafeStats(safeId) {
  ensureAccountingStructures(AppState.db);
  const safe = AppState.db.safes.find(s => s.id === safeId);
  const opening = Number(safe?.openingBalance) || 0;
  const txs = AppState.db.transactions.filter(t => t.safeId === safeId);

  let totalIn = 0;
  let totalPayment = 0;
  let totalExpense = 0;

  txs.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type === 'receipt') totalIn += amt;
    else if (t.type === 'payment') totalPayment += amt;
    else if (t.type === 'expense') totalExpense += amt;
  });

  const totalOut = totalPayment + totalExpense;
  const balance = opening + totalIn - totalOut;
  return { opening, totalIn, totalPayment, totalExpense, totalOut, balance };
}

function submitAccountingTx(e) {
  e.preventDefault();
  ensureAccountingStructures(AppState.db);

  const safeId = document.getElementById('acc-tx-safe')?.value || AppState.db.safes[0]?.id;
  const amount = Math.max(0, Number(document.getElementById('acc-tx-amount')?.value) || 0);
  const party = document.getElementById('acc-tx-party')?.value.trim() || '';
  const rawDesc = document.getElementById('acc-tx-desc')?.value.trim() || '';
  const description = rawDesc || `${ACC_TYPE_META[accSelectedType].label} (${party})`;
  const rawDate = document.getElementById('acc-tx-date')?.value || getLocalDateTimeValue(0);

    openQuickAddContactModal('accounting');

    amount,
    party,
    description,
    date: formatDateTimeDisplay(rawDate)

  saveDatabase();

  switchTab('accounting');

/* ==========================================================================
   9. CONTACTS & CUSTOMERS (جهات الاتصال والعملاء — مع البحث الشامل بأي رفرنس وكشف حركات الزبون)
   ========================================================================== */
let quickContactReturnTab = '';
let contactUniversalSearchQuery = '';
let selectedContactStatementId = '';

function getContactMovements(contact) {
  ensureAccountingStructures(AppState.db);
  if (!contact) {
    return {
      jobs: [],
      contracts: [],
      invoices: [],
      transactions: [],
      totalReceipts: 0,
      totalPayments: 0,
      totalExpenses: 0,
      totalInvoiced: 0,
      totalRemainingOnJobs: 0,
      totalCount: 0,
      matchedRefs: []
    };
  }

  const cId = (contact.id || '').trim();
  const cName = (contact.name || '').trim();
  const cPhone = (contact.phone || '').trim();
  const cPlate = (contact.defaultPlate || '').trim();
  const cRef = (contact.refNumber || '').trim();

  const matchesContact = (itemCustomerId, itemName, itemPhone, itemPlate) => {
    if (cId && itemCustomerId && itemCustomerId === cId) return true;
    if (cName && itemName && itemName.trim() === cName) return true;
    if (cPhone && itemPhone && itemPhone.trim() === cPhone) return true;
    if (cPlate && itemPlate && itemPlate.trim() === cPlate) return true;
    return false;
  };

  const jobs = (AppState.db.jobCards || []).filter(j =>
    matchesContact(j.customerId, j.customerName, j.customerPhone, j.plateNumber)
  );
  const jobIds = new Set(jobs.map(j => j.id));

  const contracts = (AppState.db.trafficContracts || []).filter(tc =>
    matchesContact(tc.customerId, tc.buyerName, tc.buyerPhone, tc.plateNumber) ||
    (cName && tc.sellerName && tc.sellerName.trim() === cName) ||
    (tc.jobId && jobIds.has(tc.jobId)) ||
    (cRef && (tc.contractNumber === cRef || tc.id === cRef))
  );

  const invoices = (AppState.db.invoices || []).filter(inv =>
    matchesContact(inv.customerId, inv.customerName, inv.customerPhone, inv.plateNumber) ||
    (inv.jobCardId && jobIds.has(inv.jobCardId))
  );

  const transactions = (AppState.db.transactions || []).filter(tx =>
    (cName && tx.party && tx.party.trim() === cName) ||
    (cId && tx.contactId && tx.contactId === cId) ||
    (cPhone && tx.description && tx.description.includes(cPhone)) ||
    (cRef && tx.description && tx.description.includes(cRef))
  );

  const totalReceipts = transactions
    .filter(tx => tx.type === 'receipt')
    .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
  const totalPayments = transactions
    .filter(tx => tx.type === 'payment')
    .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
  const totalExpenses = transactions
    .filter(tx => tx.type === 'expense')
    .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);

  let totalInvoiced = 0;
  let totalRemainingOnJobs = 0;
  jobs.forEach(j => {
    const t = calcJobTotals(j);
    totalInvoiced += t.total;
    totalRemainingOnJobs += t.remaining;
  });

  const matchedRefs = [
    cId,
    cRef,
    cPhone,
    cPlate,
    ...jobs.map(j => j.id),
    ...jobs.map(j => j.plateNumber),
    ...jobs.map(j => j.vin),
    ...jobs.map(j => j.trafficContract),
    ...contracts.map(tc => tc.contractNumber),
    ...contracts.map(tc => tc.id),
    ...contracts.map(tc => tc.plateNumber),
    ...contracts.map(tc => tc.vin),
    ...invoices.map(inv => inv.id),
    ...transactions.map(tx => tx.id)
  ].filter(Boolean);

  return {
    jobs,
    contracts,
    invoices,
    transactions,
    totalReceipts,
    totalPayments,
    totalExpenses,
    totalInvoiced,
    totalRemainingOnJobs,
    totalCount: jobs.length + contracts.length + invoices.length + transactions.length,
    matchedRefs
  };
}

function contactMatchesUniversalQuery(contact, rawQuery) {
  if (!rawQuery) return { matched: true, reason: '' };
  const q = rawQuery.trim().toLowerCase();
  if (!q) return { matched: true, reason: '' };

  const mov = getContactMovements(contact);

  if ((contact.name || '').toLowerCase().includes(q)) return { matched: true, reason: `الاسم: ${contact.name}` };
  if ((contact.phone || '').toLowerCase().includes(q)) return { matched: true, reason: `الهاتف: ${contact.phone}` };
  if ((contact.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم جهة الاتصال: ${contact.id}` };
  if ((contact.refNumber || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم المرجع/العقد: ${contact.refNumber}` };
  if ((contact.defaultPlate || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم اللوحة: ${contact.defaultPlate}` };
  if ((contact.defaultVehicle || '').toLowerCase().includes(q)) return { matched: true, reason: `السيارة: ${contact.defaultVehicle}` };

  for (const tc of mov.contracts) {
    if ((tc.contractNumber || '').toLowerCase().includes(q) || (tc.id || '').toLowerCase().includes(q)) {
      return { matched: true, reason: `رقم العقد المروري: ${tc.contractNumber || tc.id}` };
    }
    if ((tc.plateNumber || '').toLowerCase().includes(q) || (tc.vin || '').toLowerCase().includes(q) || (tc.contractText || '').toLowerCase().includes(q)) {
      return { matched: true, reason: `عقد مروري (${tc.contractNumber || tc.id})` };
    }
  }

  for (const j of mov.jobs) {
    if ((j.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم أمر العمل: ${j.id}` };
    if ((j.plateNumber || '').toLowerCase().includes(q)) return { matched: true, reason: `لوحة المركبة: ${j.plateNumber}` };
    if ((j.vin || '').toLowerCase().includes(q)) return { matched: true, reason: `الشاصي: ${j.vin}` };
    if ((j.trafficContract || '').toLowerCase().includes(q)) return { matched: true, reason: `العقد المروري بأمر العمل: ${j.id}` };
    if ((j.vehicleTitle || '').toLowerCase().includes(q) || (j.complaint || '').toLowerCase().includes(q)) {
      return { matched: true, reason: `أمر عمل (${j.id})` };
    }
  }

  for (const inv of mov.invoices) {
    if ((inv.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم الفاتورة: ${inv.id}` };
  }

  for (const tx of mov.transactions) {
    if ((tx.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم السند المالي: ${tx.id}` };
    if ((tx.description || '').toLowerCase().includes(q) || String(tx.amount || '').includes(q)) {
      return { matched: true, reason: `حركة مالية (${tx.id})` };
    }
  }

  return { matched: false, reason: '' };
}

  }
}

function submitDirectContactInvoice(e) {
  e.preventDefault();
  const contactId = document.getElementById('bill-contact-select')?.value || '';
  const contact = (AppState.db.customers || []).find(c => c.id === contactId);

  if (!contact) {
    showToast('⚠️ لا يمكن إنشاء فاتورة إلا بعد اختيار الزبون من جهات الاتصال!');
    openQuickAddContactModal('billing');
    return;
  }

  const vehicleInfo = document.getElementById('bill-vehicle-info')?.value.trim() || contact.defaultVehicle || 'مركبة';
  const rawTotalAmount = Math.max(0, Number(document.getElementById('bill-total-amount')?.value) || 0);
  const safeId = document.getElementById('bill-safe-select')?.value || AppState.db.safes?.[0]?.id || 'SAFE-01';
  const serviceDesc = document.getElementById('bill-service-desc')?.value.trim() || 'خدمات صيانة';
  const trafficContract = document.getElementById('bill-traffic-contract')?.value.trim() || '';

  if (rawTotalAmount <= 0) {
    showToast('يرجى إدخال مبلغ الفاتورة');
    return;
  }

  const nowStr = formatDateTimeDisplay(getLocalDateTimeValue(0));
  const newJobId = 'JC-' + Date.now().toString().slice(-6);
  const safeObj = (AppState.db.safes || []).find(s => s.id === safeId);
  const finalNetAmount = rawTotalAmount;

  const newJob = {
    id: newJobId,
    createdAt: nowStr,
    receivedAt: nowStr,
    deliveryAt: nowStr,
    signatureText: contact.name,
    signatureImage: null,
    vehicleId: 'VEH-' + Date.now().toString().slice(-6),
    plateNumber: contact.defaultPlate || '',
    vehicleTitle: vehicleInfo,
    vin: 'SKS-' + Math.floor(100000 + Math.random() * 900000),
    customerId: contact.id,
    customerName: contact.name,
    customerPhone: contact.phone || '',
    mileageIn: 0,
    fuelLevel: '50%',
    bayId: 'BAY-01',
    technicianName: 'مركز SKS Car',
    status: 'ready',
    priority: 'عادي',
    complaint: serviceDesc,
    diagnosis: serviceDesc,
    trafficContract,
    services: [{ name: serviceDesc, price: rawTotalAmount }],
    parts: [],
    discount: 0,
    paidAmount: finalNetAmount,
    paymentStatus: 'paid'
  };

  if (trafficContract) {
    ensureAccountingStructures(AppState.db);
    AppState.db.trafficContracts.unshift({
      id: 'TC-' + Date.now().toString().slice(-6),
      contractNumber: 'MR-' + Date.now().toString().slice(-5),
      date: nowStr,
      customerId: contact.id,
      sellerName: 'مركز SKS Car / الطرف الأول',
      buyerName: contact.name,
      buyerPhone: contact.phone || '',
      vehicleTitle: vehicleInfo,
      plateNumber: contact.defaultPlate || '',
      vin: newJob.vin,
      amount: finalNetAmount,
      contractText: trafficContract,
      jobId: newJobId
    });
  }

  AppState.db.jobCards.unshift(newJob);

  AppState.db.invoices.unshift({
    id: 'INV-' + Date.now().toString().slice(-6),
    jobCardId: newJob.id,
    customerId: contact.id,
    date: nowStr,
    customerName: contact.name,
    plateNumber: contact.defaultPlate || '',
    vehicleTitle: vehicleInfo,
    subtotal: rawTotalAmount,
    discount: 0,
    total: finalNetAmount,
    paid: finalNetAmount,
    method: safeObj ? safeObj.name : 'نقدي',
    status: 'مدفوعة بالكامل'
  });

  ensureAccountingStructures(AppState.db);
  if (finalNetAmount > 0) {
    AppState.db.transactions.unshift({
      id: 'TRX-' + Date.now().toString().slice(-6),
      type: 'receipt',
      safeId,
      contactId: contact.id,
      amount: finalNetAmount,
      party: contact.name,
      description: `فاتورة صيانة (${serviceDesc}) — ${vehicleInfo}`,
      date: nowStr
    });
  }

  contact.totalVisits = (Number(contact.totalVisits) || 0) + 1;

  preselectedContactId = '';
  saveDatabase();
  showToast(`تم إصدار الفاتورة للزبون (${contact.name}) بنجاح ✅`);
  switchTab('billing');
}

function fillDefaultTrafficContractTemplate(textareaId) {
  const el = document.getElementById(textareaId);

  const today = new Date().toLocaleDateString('ar-IQ');
  el.value = `عقد مروري رسمي - بتاريخ (${today})\nيقر الطرف الأول (البائع) والطرف الثاني (المشتري) بصحة بيانات المركبة المذكورة أعلاه ومطابقتها للفحص الفني والمروري، وخلوها من الحجوزات أو الموانع القانونية، وتم الاتفاق على إتمام إجراءات التحويل المروري وفق الأصول القانونية.`;
  el.focus();
}

function saveJobTrafficContract(jobId) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  if (!job) return;
  const val = document.getElementById('modal-traffic-contract')?.value.trim() || '';
  job.trafficContract = val;

  ensureAccountingStructures(AppState.db);
  if (val) {
    const existing = AppState.db.trafficContracts.find(tc => tc.jobId === jobId);
    if (existing) {
      existing.contractText = val;
    } else {
      const totals = calcJobTotals(job);
      AppState.db.trafficContracts.unshift({
        id: 'TC-' + Date.now().toString().slice(-6),
        contractNumber: 'MR-' + Date.now().toString().slice(-5),
        date: formatDateTimeDisplay(getLocalDateTimeValue(0)),
        sellerName: 'مركز SKS Car / الطرف الأول',
        buyerName: job.customerName,
        buyerPhone: job.customerPhone || '',
        vehicleTitle: job.vehicleTitle,
        plateNumber: job.plateNumber,
        vin: job.vin || '',
        amount: totals.total,
        contractText: val,
        jobId: job.id
      });
    }
  }
  saveDatabase();
  showToast('تم حفظ العقد المروري للمركبة بنجاح');
}
