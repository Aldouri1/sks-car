function onTrafficSellerChange(sellerName) {
  const el = document.getElementById('tc-seller-name');
  if (el && sellerName) el.value = sellerName;
}

function onTrafficBuyerChange(contactId) {
  const contact = (AppState.db.customers || []).find(c => c.id === contactId);
  if (!contact) return;
  const nameEl = document.getElementById('tc-buyer-name');
  const phoneEl = document.getElementById('tc-buyer-phone');
  const vehEl = document.getElementById('tc-vehicle-title');
  const plateEl = document.getElementById('tc-plate-number');

  if (nameEl) nameEl.value = contact.name;
  if (phoneEl) phoneEl.value = contact.phone || '';
  if (vehEl && contact.defaultVehicle && !vehEl.value) vehEl.value = contact.defaultVehicle;
  if (plateEl && contact.defaultPlate && !plateEl.value) plateEl.value = contact.defaultPlate;
}

function submitTrafficContract(e) {
  e.preventDefault();
  ensureAccountingStructures(AppState.db);

  const buyerContactId = document.getElementById('tc-buyer-select')?.value || '';
  const contractNumber = document.getElementById('tc-contract-number')?.value.trim() || ('MR-' + Date.now().toString().slice(-5));
  const sellerName = document.getElementById('tc-seller-name')?.value.trim() || 'الطرف الأول';
  const buyerName = document.getElementById('tc-buyer-name')?.value.trim() || 'الطرف الثاني';
  const buyerPhone = document.getElementById('tc-buyer-phone')?.value.trim() || '';
  const vehicleTitle = document.getElementById('tc-vehicle-title')?.value.trim() || '';
  const plateNumber = document.getElementById('tc-plate-number')?.value.trim() || '';
  const vin = document.getElementById('tc-vin')?.value.trim() || '';
  const amount = Math.max(0, Number(document.getElementById('tc-amount')?.value) || 0);
  const contractText = document.getElementById('tc-contract-text')?.value.trim() || '';

  if (!contractText) {
    showToast('يرجى كتابة نص وبنود العقد المروري');
    return;
  }

  const newContract = {
    id: 'TC-' + Date.now().toString().slice(-6),
    contractNumber,
    date: formatDateTimeDisplay(getLocalDateTimeValue(0)),
    customerId: buyerContactId,
    sellerName,
    buyerName,
    buyerPhone,
    vehicleTitle,
    plateNumber,
    vin,
    amount,
    contractText,
    attachments: JSON.parse(JSON.stringify(contractFormAttachments || []))
  };

  AppState.db.trafficContracts.unshift(newContract);
  contractFormAttachments = [];
  saveDatabase();
  showToast('تم حفظ العقد المروري وصور المستمسكات بنجاح');
  switchTab('contracts');
}

function deleteTrafficContract(contractId) {
  ensureAccountingStructures(AppState.db);
  AppState.db.trafficContracts = AppState.db.trafficContracts.filter(c => c.id !== contractId);
  saveDatabase();
  showToast('تم حذف العقد المروري');
  switchTab('contracts');
}

  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      AppState.db = Object.assign({}, JSON.parse(JSON.stringify(INITIAL_SKS_DATA)), parsed);
      AppState.db.brand = SKS_BRAND;
      saveDatabase();
      switchTab('dashboard');
      showToast('تم استرجاع جميع البيانات بنجاح!');
    } catch (err) {
      showToast('الملف غير صالح');

  };
  reader.readAsText(file);
}

/* ==========================================================================
   11. FLOATING MINI CALCULATOR (أيقونة الحاسبة السريعة في أسفل الشاشة)
   ========================================================================== */
let miniCalcExpr = '';
let miniCalcJustEvaluated = false;

function toggleMiniCalculator(forceState) {
  const popup = document.getElementById('mini-calc-popup');
  if (!popup) return;
  const isHidden = popup.classList.contains('hidden');
  const nextShow = typeof forceState === 'boolean' ? forceState : isHidden;

  if (nextShow) {
    popup.classList.remove('hidden');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  } else {
    popup.classList.add('hidden');
  }
}

function updateMiniCalcScreen(mainVal, subExpr) {
  const dispEl = document.getElementById('mini-calc-display');
  const exprEl = document.getElementById('mini-calc-expr');
  if (dispEl) {
    const num = Number(mainVal);
    if (mainVal !== '' && !isNaN(num) && !String(mainVal).endsWith('.')) {
      dispEl.textContent = num.toLocaleString('en-US', { maximumFractionDigits: 4 });
    } else {
      dispEl.textContent = mainVal || '0';
    }
  }
  if (exprEl) {
    exprEl.innerHTML = subExpr ? subExpr.replace(/\*/g, '×').replace(/\//g, '÷') : '&nbsp;';
  }
}

function calcInput(token) {
  const ops = ['+', '-', '*', '/'];

  if (token === 'C') {
    miniCalcExpr = '';
    miniCalcJustEvaluated = false;
    updateMiniCalcScreen('0', '');
    return;
  }

  if (token === 'BACK') {
    if (miniCalcJustEvaluated) {
      miniCalcExpr = '';
      miniCalcJustEvaluated = false;
      updateMiniCalcScreen('0', '');
      return;
    }
    miniCalcExpr = miniCalcExpr.slice(0, -1);
    updateMiniCalcScreen(miniCalcExpr || '0', miniCalcExpr);
    return;
  }

  if (token === '=') {
    if (!miniCalcExpr) return;
    try {
      const sanitized = miniCalcExpr.replace(/[^0-9+\-*/.]/g, '');
      const result = Function(`"use strict"; return (${sanitized})`)();
      if (typeof result === 'number' && isFinite(result)) {
        const rounded = Math.round(result * 10000) / 10000;
        updateMiniCalcScreen(String(rounded), `${miniCalcExpr} =`);
        miniCalcExpr = String(rounded);
        miniCalcJustEvaluated = true;
      }
    } catch (e) {
      updateMiniCalcScreen('خطأ', miniCalcExpr);
      miniCalcExpr = '';
    }
    return;
  }

  if (ops.includes(token)) {
    miniCalcJustEvaluated = false;
    if (!miniCalcExpr) {
      if (token === '-') {
        miniCalcExpr = '-';
        updateMiniCalcScreen('-', '-');
      }
      return;
    }
    const lastChar = miniCalcExpr.slice(-1);
    if (ops.includes(lastChar)) {
      miniCalcExpr = miniCalcExpr.slice(0, -1) + token;
    } else {
      miniCalcExpr += token;
    }
    updateMiniCalcScreen(miniCalcExpr.split(/[+\-*/]/).pop() || '0', miniCalcExpr);
    return;
  }

  // Number or '000' or '.'
  if (miniCalcJustEvaluated) {
    miniCalcExpr = '';
    miniCalcJustEvaluated = false;
  }

  if (token === '000' && (!miniCalcExpr || ops.includes(miniCalcExpr.slice(-1)))) {
    return;
  }

  miniCalcExpr += token;
  const currentPart = miniCalcExpr.split(/[+\-*/]/).pop();
  updateMiniCalcScreen(currentPart || '0', miniCalcExpr);
}

function copyCalcResult() {
  const val = miniCalcExpr || '0';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(() => {
      showToast(`تم نسخ الرقم: ${Number(val).toLocaleString('en-US')}`);
    }).catch(() => {});
  } else {
    showToast(`النتيجة: ${val}`);
  }
}

window.addEventListener('keydown', (e) => {
  const popup = document.getElementById('mini-calc-popup');
  if (!popup || popup.classList.contains('hidden')) return;
  const activeTag = document.activeElement?.tagName;
  if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return;

  if (e.key >= '0' && e.key <= '9') {
    e.preventDefault();
    calcInput(e.key);
  } else if (['+', '-', '*', '/'].includes(e.key)) {
    e.preventDefault();
    calcInput(e.key);
  } else if (e.key === 'Enter' || e.key === '=') {
    e.preventDefault();
    calcInput('=');
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    calcInput('BACK');
  } else if (e.key === 'Escape') {
    e.preventDefault();
    toggleMiniCalculator(false);
  } else if (e.key === '.') {
    e.preventDefault();
    calcInput('.');
  }
});

window.addEventListener('DOMContentLoaded', initApp);

</script>
</body>
</html>
