          </div>
        ` : filteredPlans.map(plan => {
          const st = getInstallmentPlanStats(plan);
          const isCollapsed = collapsedInstallmentPlans.has(plan.id);
          return `
            <div class="rounded-2xl border-2 ${st.isCompleted ? 'border-emerald-300 bg-emerald-50/20' : (st.overdueCount > 0 ? 'border-rose-300 bg-rose-50/15' : 'border-slate-200 bg-white')} overflow-hidden">
              <div class="p-4 bg-slate-50/80 border-b flex flex-wrap items-center justify-between gap-3">
                <div class="space-y-1">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="font-black text-xs px-2.5 py-1 rounded-lg bg-[#070b14] text-sky-400" dir="ltr">${plan.id}</span>
                    <span class="font-black text-sm text-[#0f172a]">${plan.customerName}</span>
                    <span class="text-xs font-bold text-slate-500" dir="ltr">${plan.customerPhone || ''}</span>
                    ${st.isCompleted
                      ? `<span class="px-2.5 py-0.5 rounded-lg bg-emerald-600 text-white text-[11px] font-black">✅ مسدد بالكامل</span>`
                      : (st.overdueCount > 0
                        ? `<span class="px-2.5 py-0.5 rounded-lg bg-rose-600 text-white text-[11px] font-black">⚠️ ${st.overdueCount} قسط متأخر</span>`
                        : `<span class="px-2.5 py-0.5 rounded-lg bg-blue-100 text-blue-800 text-[11px] font-black">📅 قيد التقسيط (${st.paidCount}/${st.totalCount})</span>`
                      )
                    }
                  </div>
                  <div class="text-xs font-bold text-slate-600">
                    🚗 ${plan.itemDescription}${plan.vehicleTitle ? ` — ${plan.vehicleTitle} (${plan.plateNumber || 'بدون لوحة'})` : ''}
                    ${plan.guarantorName ? ` &nbsp;|&nbsp; 🛡️ الكفيل: <strong>${plan.guarantorName}</strong>` : ''}
                  </div>
                </div>

                <div class="flex flex-wrap items-center gap-1.5">
                  <button type="button" onclick="printInstallmentPlanSchedule('${plan.id}')" class="sks-electric-btn px-3 py-1.5 text-xs">🖨️ طباعة الجدول الكامل</button>
                  <button type="button" onclick="toggleInstallmentPlanCollapse('${plan.id}')" class="sks-light-btn px-3 py-1.5 text-xs">${isCollapsed ? '▼ عرض الأقساط' : '▲ طي الجدول'}</button>
                  <button type="button" onclick="deleteInstallmentPlan('${plan.id}')" class="px-2.5 py-1.5 rounded-xl bg-rose-50 hover:bg-rose-600 text-rose-600 hover:text-white text-xs font-black transition" title="حذف العقد">✕</button>
                </div>
              </div>

              <!-- Plan Financial Summary Bar -->
              <div class="px-4 py-3 grid grid-cols-2 sm:grid-cols-4 gap-3 text-xs border-b bg-white">
                <div>
                  <span class="text-slate-500 font-bold">الإجمالي:</span>
                  <strong class="block text-sm font-black text-[#0f172a]">${formatCurrency(st.totalAmount)}</strong>
                </div>
                <div>
                  <span class="text-slate-500 font-bold">المقدمة:</span>
                  <strong class="block text-sm font-black text-sky-700">${formatCurrency(st.downPayment)}</strong>
                </div>
                <div>
                  <span class="text-slate-500 font-bold">إجمالي المدفوع:</span>
                  <strong class="block text-sm font-black text-emerald-600">${formatCurrency(st.totalPaid)} (${st.progressPct}%)</strong>
                </div>
                <div>
                  <span class="text-slate-500 font-bold">المتبقي للسداد:</span>
                  <strong class="block text-sm font-black text-amber-600">${formatCurrency(st.remaining)}</strong>
                </div>
              </div>

              ${!isCollapsed ? `
                <div class="sks-table-wrap">
                  <table class="sks-table">
                    <thead>
                      <tr>
                        <th>#</th>
                        <th>رقم الكمبيالة</th>
                        <th>تاريخ الاستحقاق</th>
                        <th>مبلغ القسط</th>
                        <th>الحالة</th>
                        <th>الإجراءات (تسديد / طباعة / واتساب)</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${(plan.schedule || []).map((it, idx) => {
                        const isOverdue = it.status !== 'paid' && it.dueDate && it.dueDate < todayStr;
                        const isToday = it.status !== 'paid' && it.dueDate === todayStr;
                        return `
                          <tr class="${it.status === 'paid' ? 'bg-emerald-50/35' : (isOverdue ? 'bg-rose-50/50' : (isToday ? 'bg-amber-50/50' : ''))}">
                            <td class="font-black text-xs">${it.number}</td>
                            <td class="font-black text-xs text-[#0066ff]" dir="ltr">${it.promissoryNo}</td>
                            <td class="font-black text-xs" dir="ltr">${it.dueDate}</td>
                            <td class="font-black text-xs">${formatCurrency(it.amount)}</td>
                            <td>
                              ${it.status === 'paid'
                                ? `<span class="px-2.5 py-0.5 rounded-lg bg-emerald-100 text-emerald-800 text-[11px] font-black">✅ مدفوع (${it.paidAt})</span>`
                                : (isOverdue
                                  ? `<span class="px-2.5 py-0.5 rounded-lg bg-rose-600 text-white text-[11px] font-black">🔴 متأخر</span>`
                                  : (isToday
                                    ? `<span class="px-2.5 py-0.5 rounded-lg bg-orange-500 text-white text-[11px] font-black">🟠 مستحق اليوم</span>`
                                    : `<span class="px-2.5 py-0.5 rounded-lg bg-slate-100 text-slate-700 text-[11px] font-black">⏳ مجدول</span>`
                                  )
                                )
                              }
                            </td>
                            <td>
                              <div class="flex flex-wrap items-center gap-1.5">
                                ${it.status !== 'paid'
                                  ? `<button type="button" onclick="openPayInstallmentModal('${plan.id}', ${idx})" class="bg-emerald-600 hover:bg-emerald-500 text-white font-extrabold px-2.5 py-1 rounded-lg text-[11px]">✅ تسديد للقاصة</button>`
                                  : `<span class="text-[11px] font-black text-emerald-700" dir="ltr">${it.receiptId || ''}</span>`
                                }
                                <button type="button" onclick="printPromissoryNote('${plan.id}', ${idx})" class="sks-navy-btn px-2.5 py-1 text-[11px]">
                                  ${it.status === 'paid' ? '🖨️ وصل القسط' : '🖨️ سند كمبيالة'}
                                </button>
                                ${it.status !== 'paid'
                                  ? `<button type="button" onclick="sendInstallmentWhatsAppReminder('${plan.id}', ${idx})" class="bg-sky-600 hover:bg-sky-500 text-white font-extrabold px-2.5 py-1 rounded-lg text-[11px]">💬 تذكير واتساب</button>`
                                  : ''
                                }
                              </div>
                            </td>
                          </tr>
                        `;
                      }).join('')}
                    </tbody>
                  </table>
                </div>
              ` : ''}
            </div>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* ==========================================================================
   4. SIMPLE DASHBOARD (الرئيسية البسيطة والواضحة + تذكيرات الصيانة والأقساط + تصدير Excel)
   ========================================================================== */
function renderDashboardView() {
  const jobs = AppState.db.jobCards;
  const activeJobs = jobs.filter(j => j.status !== 'delivered');
  const readyJobs = jobs.filter(j => j.status === 'ready');
  const totalRevenue = jobs.reduce((sum, j) => sum + calcJobTotals(j).paid, 0);
  const reminders = getMaintenanceReminders();
  const dueInstallments = getDueInstallmentAlerts();

  return `
    <div class="space-y-5">
      <!-- Clean Header Card with SKS Car Logo -->
      <div class="bg-[#070b14] text-white rounded-2xl p-5 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b-4 border-[#0066ff]">

          ${renderSksLogo('sm')}
          <div>
            <h2 class="text-lg md:text-xl font-black">نظام SKS Car لإدارة خدمات السيارات</h2>
            <p class="text-xs text-slate-400 font-semibold">لوحة المتابعة السريعة، تذكيرات الصيانة الدورية، الأقساط والـ VIP</p>

        <div class="flex flex-wrap items-center gap-2">

            <i data-lucide="plus-circle" class="w-4 h-4"></i>
            <span>استلام سيارة جديدة</span>
          </button>
        </div>
      </div>

      <!-- Summary KPI Numbers -->
      <div class="grid grid-cols-2 lg:grid-cols-5 gap-3.5">
        <div class="sks-card p-4">
          <div class="text-xs font-bold text-slate-500">سيارات قيد العمل</div>
          <div class="text-2xl font-black text-[#0066ff] mt-1">${activeJobs.length}</div>
        </div>

        <div class="sks-card p-4">
          <div class="text-xs font-bold text-slate-500">جاهزة للتسليم</div>
          <div class="text-2xl font-black text-emerald-600 mt-1">${readyJobs.length}</div>
        </div>

        <div onclick="switchTab('billing')" class="sks-card p-4 cursor-pointer hover:border-blue-500 transition">
          <div class="text-xs font-bold text-slate-500">المبالغ المستلمة</div>
          <div class="text-xl font-black mt-1">${formatCurrency(totalRevenue)}</div>
        </div>

        <div class="sks-card p-4">
          <div class="text-xs font-bold text-slate-500">تذكيرات الصيانة القادمة</div>
          <div class="text-2xl font-black text-amber-600 mt-1">${reminders.length}</div>
        </div>

        <div onclick="switchTab('installments')" class="sks-card p-4 cursor-pointer hover:border-rose-500 transition col-span-2 lg:col-span-1 ${dueInstallments.length > 0 ? 'border-2 border-rose-400 bg-rose-50/40' : ''}">
          <div class="text-xs font-bold text-slate-500">📅 أقساط مستحقة / متأخرة</div>
          <div class="text-2xl font-black ${dueInstallments.length > 0 ? 'text-rose-600' : 'text-emerald-600'} mt-1">${dueInstallments.length}</div>
        </div>
      </div>

      <!-- Daily Due & Overdue Installments Alert Banner on Dashboard -->
      ${dueInstallments.length > 0 ? `
        <div class="sks-card p-5 space-y-3 border-2 border-rose-400/80 bg-rose-50/30">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <div>
              <h3 class="text-base font-black text-rose-800">📅 تنبيه يومي: الأقساط والكمبيالات المستحقة أو المتأخرة (${dueInstallments.length})</h3>
              <p class="text-xs text-slate-600 font-bold">أقساط حان أو اقترب موعد استحقاقها خلال 7 أيام — يمكنك تسديدها أو إرسال تذكير واتساب مباشرة</p>
            </div>
            <button type="button" onclick="switchTab('installments')" class="px-3 py-1.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-black">فتح قسم الأقساط ←</button>
          </div>
          <div class="sks-table-wrap">
            <table class="sks-table">
              <thead>
                <tr>
                  <th>الزبون</th>
                  <th>الكمبيالة / الموضوع</th>
                  <th>الاستحقاق</th>
                  <th>المبلغ</th>
                  <th>الحالة</th>
                  <th>إجراء سريع</th>

                ${dueInstallments.slice(0, 6).map(a => `
                  <tr>
                    <td>
                      <div class="font-black text-xs">${a.plan.customerName}</div>
                      <div class="text-[11px] text-slate-500 font-bold" dir="ltr">${a.plan.customerPhone || '—'}</div>
                    </td>
                    <td class="text-xs font-bold">
                      <span class="text-[#0066ff] font-black" dir="ltr">${a.item.promissoryNo}</span> — ${a.plan.itemDescription}

                    <td class="font-black text-xs" dir="ltr">${a.item.dueDate}</td>

function onReceptionContactChange(contactId) {
  preselectedContactId = contactId;
  const contact = (AppState.db.customers || []).find(c => c.id === contactId);
  const phoneEl = document.getElementById('rec-customer-phone');
  const vehEl = document.getElementById('rec-vehicle-title');
  const plateEl = document.getElementById('rec-plate-number');
  const sigText = document.getElementById('rec-signature-text');

  if (contact) {
    if (phoneEl) phoneEl.value = contact.phone || '';
    if (vehEl && contact.defaultVehicle && !vehEl.value) {
      vehEl.value = contact.defaultVehicle;
      onReceptionVehicleTitleInput(contact.defaultVehicle);
    }
    if (plateEl && contact.defaultPlate && !plateEl.value) plateEl.value = contact.defaultPlate;
    if (sigText) sigText.value = contact.name;
  } else {
    if (phoneEl) phoneEl.value = '';
    if (sigText) sigText.value = '';
  }

  const loySlot = document.getElementById('rec-vip-loyalty-slot');
  if (loySlot) {
    loySlot.innerHTML = contact ? renderLoyaltyBannerForForm(contact, 'rec') : '';
  }
}

function syncSignatureCustomerName(val) {
  const sigText = document.getElementById('rec-signature-text');
  if (sigText && !sigText.dataset.edited) {
    sigText.value = val;
  }
}

function initSignaturePad() {
  const canvas = document.getElementById('customer-signature-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  sigCanvasState.hasDrawn = false;

  ctx.strokeStyle = '#0f172a';
  ctx.lineWidth = 2.5;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  let drawing = false;

  const getPos = (e) => {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const scaleY = canvas.height / rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * scaleX,
      y: (clientY - rect.top) * scaleY
    };
  };

  const start = (e) => {
    drawing = true;
    sigCanvasState.hasDrawn = true;
    const p = getPos(e);
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
  };

  const move = (e) => {
    if (!drawing) return;
    if (e.cancelable) e.preventDefault();
    const p = getPos(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
  };

  const stop = () => {
    drawing = false;
  };

  canvas.onmousedown = start;
  canvas.onmousemove = move;
  window.addEventListener('mouseup', stop);

  canvas.ontouchstart = start;
  canvas.ontouchmove = move;
  canvas.ontouchend = stop;
}

function submitNewReceptionJob(e) {
  e.preventDefault();
  const contactId = document.getElementById('rec-contact-select')?.value || '';
  const contact = (AppState.db.customers || []).find(c => c.id === contactId);

  if (!contact) {
    showToast('⚠️ لا يمكن الاستلام أو إنشاء فاتورة إلا بعد اختيار الزبون من جهات الاتصال!');
    openQuickAddContactModal('reception');
    return;
  }

  const customerName = contact.name;
  const customerPhone = contact.phone || document.getElementById('rec-customer-phone')?.value.trim() || '';
  const vehicleTitle = document.getElementById('rec-vehicle-title').value.trim();
  const plateNumber = document.getElementById('rec-plate-number').value.trim();
  const mileageIn = Number(document.getElementById('rec-mileage').value) || 0;
  const complaint = document.getElementById('rec-complaint').value.trim();
  const trafficContract = document.getElementById('rec-traffic-contract')?.value.trim() || '';

  const nextServiceDate = document.getElementById('rec-next-service-date')?.value || '';
  const nextServiceKm = Number(document.getElementById('rec-next-service-km')?.value) || (mileageIn + 5000);
  const nextServiceNote = document.getElementById('rec-next-service-note')?.value.trim() || 'تبديل دهن وفلتر وفحص دوري';
  const bodyDamages = JSON.parse(JSON.stringify(receptionBodyDamages || []));

  const receivedAt = document.getElementById('rec-received-at')?.value || getLocalDateTimeValue(0);
  const deliveryAt = document.getElementById('rec-delivery-at')?.value || getLocalDateTimeValue(3);
  const signatureText = document.getElementById('rec-signature-text')?.value.trim() || customerName;

  const canvas = document.getElementById('customer-signature-canvas');
  const signatureImage = (canvas && sigCanvasState.hasDrawn) ? canvas.toDataURL('image/png') : null;

  const selectedServiceIds = Array.from(document.querySelectorAll('input[name="rec-services"]:checked')).map(el => el.value);
  const services = AppState.db.serviceCatalog
    .filter(s => selectedServiceIds.includes(s.id))
    .map(s => {
      const customPriceEl = document.getElementById('rec-srv-price-' + s.id);
      const finalPrice = customPriceEl ? (Number(customPriceEl.value) || 0) : s.price;
      return { name: s.name, price: finalPrice };
    });

  const customOpName = document.getElementById('rec-custom-op-name')?.value.trim();
  const customOpPrice = Number(document.getElementById('rec-custom-op-price')?.value) || 0;
  if (customOpName) {
    services.push({ name: customOpName, price: customOpPrice });
  }

  const newJobId = 'JC-' + Date.now().toString().slice(-6);
  const nowStr = formatDateTimeDisplay(receivedAt);

  // Loyalty & VIP Auto-Discount Calculation
  const loyInfoBefore = getCustomerLoyaltyInfo(contact);
  const applyVipChecked = !!document.getElementById('rec-apply-vip-discount')?.checked;
  const redeemFreeChecked = !!document.getElementById('rec-redeem-free-points')?.checked;
  const rawSubtotal = services.reduce((s, item) => s + (Number(item.price) || 0), 0);
  let computedDiscount = 0;
  let loyaltyDiscountLabel = '';
  let loyaltyRedeemedNow = false;

  if (redeemFreeChecked && loyInfoBefore.canRedeemFree) {
    // Free service reward: discount the lowest/primary selected service (or full subtotal if 1 service)
    const prices = services.map(s => Number(s.price) || 0).filter(p => p > 0);
    computedDiscount = prices.length > 0 ? Math.min(...prices) : rawSubtotal;
    loyaltyDiscountLabel = `🎁 مكافأة استبدال ${loyInfoBefore.freeEvery} نقاط (خدمة مجانية)`;
    loyaltyRedeemedNow = redeemCustomerLoyaltyPoints(contact, loyInfoBefore.freeEvery, `استبدال نقاط بخدمة مجانية — أمر عمل ${newJobId}`);
  } else if (applyVipChecked && loyInfoBefore.autoDiscountPct > 0 && rawSubtotal > 0) {
    computedDiscount = Math.round(rawSubtotal * (loyInfoBefore.autoDiscountPct / 100));
    loyaltyDiscountLabel = `${loyInfoBefore.tier.icon} خصم ${loyInfoBefore.tier.label} تلقائي (${loyInfoBefore.autoDiscountPct}%)`;
  }

  const newJob = {
    id: newJobId,
    createdAt: nowStr,
    receivedAt,
    deliveryAt,
    signatureText,
    signatureImage,
    vehicleId: 'VEH-' + Date.now().toString().slice(-6),
    plateNumber,
    vehicleTitle,
    vin: 'SKS-' + Math.floor(100000 + Math.random() * 900000),
    customerId: contact.id,
    customerName,
    customerPhone,
    mileageIn,
    nextServiceDate,
    nextServiceKm,
    nextServiceNote,
    vehicleBodyType: selectedVehicleBodyType,
    bodyDamages,
    attachments: JSON.parse(JSON.stringify(receptionAttachments || [])),
    fuelLevel: '50%',
    bayId: 'BAY-01',
    technicianName: 'مركز SKS Car',
    status: 'in_progress',
    priority: 'عادي',
    complaint,
    diagnosis: complaint,
    trafficContract,
    services,
    parts: [],
    discount: computedDiscount,
    loyaltyDiscountLabel,
    loyaltyRedeemed: loyaltyRedeemedNow,
    vipTier: loyInfoBefore.tier.label,
    vipDiscountPct: applyVipChecked && !loyaltyRedeemedNow ? loyInfoBefore.autoDiscountPct : 0,
    paidAmount: 0,
    paymentStatus: computedDiscount >= rawSubtotal && rawSubtotal > 0 ? 'paid' : 'unpaid'
  };

  if (trafficContract) {
    ensureAccountingStructures(AppState.db);
    AppState.db.trafficContracts.unshift({
      id: 'TC-' + Date.now().toString().slice(-6),
      contractNumber: 'MR-' + Date.now().toString().slice(-5),
      date: nowStr,
      customerId: contact.id,
      sellerName: 'مركز SKS Car / الطرف الأول',
      buyerName: customerName,
      buyerPhone: customerPhone,
      vehicleTitle,
      plateNumber,
      vin: newJob.vin,
      amount: Math.max(0, rawSubtotal - computedDiscount),
      contractText: trafficContract,
      attachments: JSON.parse(JSON.stringify(receptionAttachments || [])),
      jobId: newJobId
    });
  }

  contact.totalVisits = (Number(contact.totalVisits) || 0) + 1;
  if (!loyaltyRedeemedNow) {
    awardCustomerLoyaltyPoints(contact, loyInfoBefore.cfg.pointsPerVisit, `استلام وزيارة مركبة (${newJobId})`);
  }
  const loyAfter = getCustomerLoyaltyInfo(contact);
  if (vehicleTitle) contact.defaultVehicle = vehicleTitle;
  if (plateNumber) contact.defaultPlate = plateNumber;

  AppState.db.jobCards.unshift(newJob);
  AppState.db.vehicles.unshift({
    id: newJob.vehicleId,
    customerId: contact.id,
    customerName,
    plateNumber,
    vin: newJob.vin,
    make: vehicleTitle,
    model: '',
    year: 2024,
    mileage: mileageIn,
    nextServiceDate,
    nextServiceKm,
    nextServiceNote
  });

  receptionBodyDamages = [];
  receptionAttachments = [];
  preselectedContactId = '';
  saveDatabase();
  const bonusToast = loyaltyRedeemedNow
    ? `🎁 تم استبدال النقاط وتطبيق خدمة مجانية! رصيد النقاط الحالي: ${loyAfter.points}`
    : (computedDiscount > 0
      ? `تم الاستلام وتطبيق ${loyaltyDiscountLabel} (-${formatCurrency(computedDiscount)}) | رصيد النقاط: ${loyAfter.points} ⭐`
      : `تم استلام السيارة بنجاح وحصل الزبون على نقطة ولاء (الرصيد: ${loyAfter.points} ⭐)`);
  showToast(bonusToast);
  switchTab('dashboard');
}

function syncModalServiceSelection() {
  const sel = document.getElementById('modal-add-service')?.value;

  const customInput = document.getElementById('modal-custom-service-name');
  if (sel === '__custom__') {

  const srv = AppState.db.serviceCatalog.find(s => s.id === sel);

    priceInput.value = srv.price;

function updateJobServicePrice(jobId, serviceIdx, newPrice) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  if (!job || !job.services || !job.services[serviceIdx]) return;
  job.services[serviceIdx].price = Math.max(0, Number(newPrice) || 0);
  saveDatabase();
  openJobDetailsModal(jobId);
  switchTab(AppState.activeTab);
}

function removeJobService(jobId, serviceIdx) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  if (!job || !job.services) return;
  job.services.splice(serviceIdx, 1);
  saveDatabase();
  openJobDetailsModal(jobId);
  switchTab(AppState.activeTab);
}

function addServiceToJob(jobId) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  if (!job) return;

  const customName = document.getElementById('modal-custom-service-name')?.value.trim();
  const selId = document.getElementById('modal-add-service')?.value;
  const srv = AppState.db.serviceCatalog.find(s => s.id === selId);
  const price = Math.max(0, Number(document.getElementById('modal-service-price')?.value) || 0);

  const finalName = customName || (srv ? srv.name : '');

    showToast('يرجى اختيار أو كتابة نوع العملية');
    return;
  }

  job.services.push({ name: finalName, price });
  saveDatabase();
  showToast('تمت إضافة العملية بالسعر المحدد');
  openJobDetailsModal(jobId);
  switchTab(AppState.activeTab);
}

function recordJobPayment(jobId) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  const amount = Number(document.getElementById('modal-pay-amount')?.value) || 0;
  const safeId = document.getElementById('modal-pay-safe')?.value || (AppState.db.safes?.[0]?.id || 'SAFE-01');
  if (!job || amount <= 0) return;
  job.paidAmount = (Number(job.paidAmount) || 0) + amount;
  const totals = calcJobTotals(job);
  job.paymentStatus = totals.remaining === 0 ? 'paid' : 'partial';

  const safeObj = (AppState.db.safes || []).find(s => s.id === safeId);
  const dateStr = formatDateTimeDisplay(getLocalDateTimeValue(0));

  AppState.db.invoices.unshift({
    id: 'INV-' + Date.now().toString().slice(-6),
    jobCardId: job.id,
    date: dateStr,
    customerName: job.customerName,
    plateNumber: job.plateNumber,
    vehicleTitle: job.vehicleTitle,
    subtotal: totals.subtotal,
    discount: totals.discount,
    total: totals.total,
    paid: job.paidAmount,
    method: safeObj ? safeObj.name : 'نقدي',
    status: totals.remaining === 0 ? 'مدفوعة بالكامل' : 'مدفوعة جزئياً'
  });

  ensureAccountingStructures(AppState.db);
  AppState.db.transactions.unshift({
    id: 'TRX-' + Date.now().toString().slice(-6),
    type: 'receipt',
    safeId,
    amount,
    party: job.customerName,
    description: `قبض صيانة سيارة ${job.vehicleTitle} (${job.plateNumber}) — أمر ${job.id}`,
    date: dateStr
  });

  saveDatabase();
  showToast('تم تسجيل الدفعة وإيداعها في القاصة بنجاح');
  openJobDetailsModal(jobId);
  switchTab(AppState.activeTab);
}

function calcSafeStats(safeId) {
  ensureAccountingStructures(AppState.db);
  const safe = AppState.db.safes.find(s => s.id === safeId);
  const opening = Number(safe?.openingBalance) || 0;
  const txs = AppState.db.transactions.filter(t => t.safeId === safeId);

  let totalIn = 0;
  let totalPayment = 0;
  let totalExpense = 0;

  txs.forEach(t => {
    const amt = Number(t.amount) || 0;
    if (t.type === 'receipt') totalIn += amt;
    else if (t.type === 'payment') totalPayment += amt;
    else if (t.type === 'expense') totalExpense += amt;
  });

  const totalOut = totalPayment + totalExpense;
  const balance = opening + totalIn - totalOut;
  return { opening, totalIn, totalPayment, totalExpense, totalOut, balance };
}

                <tr>

function setAccTxType(type) {
  const prevAmount = document.getElementById('acc-tx-amount')?.value || '';
  const prevParty = document.getElementById('acc-tx-party')?.value || '';
  const prevDesc = document.getElementById('acc-tx-desc')?.value || '';
  const prevSafe = document.getElementById('acc-tx-safe')?.value || '';

  accSelectedType = type;
  switchTab('accounting');

  if (prevAmount) {
    const el = document.getElementById('acc-tx-amount');
    if (el) el.value = prevAmount;
  }
  if (prevParty) {
    const el = document.getElementById('acc-tx-party');
    if (el) el.value = prevParty;
  }
  if (prevDesc) {
    const el = document.getElementById('acc-tx-desc');
    if (el) el.value = prevDesc;
  }
  if (prevSafe) {
    const el = document.getElementById('acc-tx-safe');
    if (el) el.value = prevSafe;
  }
}

function fillAccPreset(text) {
  const descEl = document.getElementById('acc-tx-desc');
  if (descEl) descEl.value = text;
  document.getElementById('acc-tx-amount')?.focus();
}

function filterBySafe(safeId) {
  accFilterSafe = safeId;
  switchTab('accounting');
}

function filterByAccType(type) {
  accFilterType = type;
  switchTab('accounting');
}

function submitAccountingTx(e) {
  e.preventDefault();
  ensureAccountingStructures(AppState.db);

  const safeId = document.getElementById('acc-tx-safe')?.value || AppState.db.safes[0]?.id;
  const amount = Math.max(0, Number(document.getElementById('acc-tx-amount')?.value) || 0);
  const party = document.getElementById('acc-tx-party')?.value.trim() || '';
  const rawDesc = document.getElementById('acc-tx-desc')?.value.trim() || '';
  const description = rawDesc || `${ACC_TYPE_META[accSelectedType].label} (${party})`;
  const rawDate = document.getElementById('acc-tx-date')?.value || getLocalDateTimeValue(0);

  if (!party) {
    showToast('⚠️ يرجى اختيار الاسم من قائمة جهات الاتصال أو إضافة جهة اتصال أولاً!');
    openQuickAddContactModal('accounting');
    return;
  }

  if (amount <= 0) {
    showToast('يرجى إدخال مبلغ صحيح');
    return;
  }

  const newTx = {
    id: 'TRX-' + Date.now().toString().slice(-6),
    type: accSelectedType,
    safeId,
    amount,
    party,
    description,
    date: formatDateTimeDisplay(rawDate)
  };

  preselectedContactId = '';
  AppState.db.transactions.unshift(newTx);
  saveDatabase();
  showToast(`تم حفظ ${ACC_TYPE_META[accSelectedType].label} باسم (${party}) بنجاح`);
  switchTab('accounting');
}

function deleteAccountingTx(txId) {
  ensureAccountingStructures(AppState.db);
  AppState.db.transactions = AppState.db.transactions.filter(t => t.id !== txId);
  saveDatabase();
  showToast('تم حذف الحركة المالية');
  switchTab('accounting');
}

  if (!modalBackdrop || !modalContent) return;

  modalContent.innerHTML = `
    <form onsubmit="submitNewSafe(event)" class="p-5 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <h3 class="text-base font-black">🏦 إضافة قاصة جديدة</h3>
        <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg bg-slate-100 text-slate-600 font-black">✕</button>
      </div>
      <div>
        <label class="block text-xs font-extrabold mb-1.5">اسم القاصة *</label>
        <input id="new-safe-name" type="text" required placeholder="مثال: قاصة الدولار / قاصة المشتريات..." class="sks-input" autofocus />
      </div>
      <div>
        <label class="block text-xs font-extrabold mb-1.5">الرصيد الافتتاحي (${SKS_BRAND.currency})</label>
        <input id="new-safe-opening" type="number" step="any" value="0" class="sks-input font-black text-center text-[#0066ff]" />
      </div>
      <div class="flex justify-end gap-2 pt-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 text-slate-700 text-xs font-extrabold">إلغاء</button>
        <button type="submit" class="sks-electric-btn px-5 py-2 text-xs">إضافة القاصة</button>
      </div>
    </form>
  `;
  modalBackdrop.classList.remove('hidden');
  modalBackdrop.classList.add('flex');

function submitNewSafe(e) {
  e.preventDefault();
  ensureAccountingStructures(AppState.db);
  const name = document.getElementById('new-safe-name')?.value.trim();
  const openingBalance = Number(document.getElementById('new-safe-opening')?.value) || 0;
  if (!name) return;

  AppState.db.safes.push({
    id: 'SAFE-' + Date.now().toString().slice(-4),
    name,
    openingBalance
  });
  saveDatabase();
  closeModal();
  showToast(`تمت إضافة "${name}" بنجاح`);
  switchTab('accounting');
}

let pendingDeleteSafeId = '';

function deleteSafeById(safeId) {
  ensureAccountingStructures(AppState.db);
  if (AppState.db.safes.length <= 1) {
    showToast('يجب بقاء قاصة واحدة على الأقل في النظام');
    return;
  }

  const safeObj = AppState.db.safes.find(s => s.id === safeId);
  if (!safeObj) return;
  pendingDeleteSafeId = safeId;

  const modalBackdrop = document.getElementById('modal-backdrop');
  const modalContent = document.getElementById('modal-content');
  if (!modalBackdrop || !modalContent) return;

  modalContent.innerHTML = `
    <form onsubmit="confirmDeleteSafeWithPassword(event)" class="p-6 space-y-4">
      <div class="flex items-center justify-between border-b pb-3">
        <div class="flex items-center gap-2 text-rose-600">
          <span class="text-xl">🔒</span>
          <h3 class="text-base font-black">تأكيد حذف القاصة (${safeObj.name})</h3>
        </div>
        <button type="button" onclick="closeModal()" class="p-1.5 rounded-lg bg-slate-100 text-slate-600 font-black">✕</button>
      </div>

      <p class="text-xs text-slate-600 font-bold leading-relaxed">
        أدخل كلمة المرور لحذف القاصة <strong>${safeObj.name}</strong> بشكل نهائي:
      </p>

      <div class="space-y-2">
        <label class="block text-xs font-extrabold">كلمة المرور:</label>
        <input id="delete-safe-password-input" type="password" required placeholder="أدخل كلمة المرور..." class="sks-input text-center font-black tracking-widest" dir="ltr" autofocus />
        <p id="delete-safe-password-error" class="hidden text-xs font-extrabold text-rose-600 text-center">❌ كلمة المرور غير صحيحة!</p>
      </div>

      <div class="flex items-center justify-end gap-2 pt-2">
        <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-extrabold">إلغاء</button>
        <button type="submit" class="px-5 py-2 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-xs font-extrabold shadow">تأكيد حذف القاصة</button>
      </div>
    </form>
  `;

  modalBackdrop.classList.remove('hidden');
  modalBackdrop.classList.add('flex');
  setTimeout(() => document.getElementById('delete-safe-password-input')?.focus(), 50);
}

function confirmDeleteSafeWithPassword(e) {
  if (e) e.preventDefault();
  const inputEl = document.getElementById('delete-safe-password-input');
  const errEl = document.getElementById('delete-safe-password-error');
  const entered = inputEl ? inputEl.value.trim() : '';

  if (entered.toLowerCase() !== 'hamdez1') {
    if (errEl) errEl.classList.remove('hidden');
    if (inputEl) {
      inputEl.value = '';
      inputEl.focus();
    }
    showToast('كلمة المرور غير صحيحة ❌');
    return;
  }

  ensureAccountingStructures(AppState.db);
  AppState.db.safes = AppState.db.safes.filter(s => s.id !== pendingDeleteSafeId);
  if (accFilterSafe === pendingDeleteSafeId) accFilterSafe = 'all';
  pendingDeleteSafeId = '';
  saveDatabase();
  closeModal();
  showToast('تم حذف القاصة بنجاح');
  switchTab('accounting');
}

function openSafeTransferModal() {
  ensureAccountingStructures(AppState.db);
  const safes = AppState.db.safes;
  if (safes.length < 2) {
    showToast('أضف قاصة ثانية أولاً للتحويل بين القاصات');
    return;
  }

function submitSafeTransfer(e) {
  e.preventDefault();
  const fromId = document.getElementById('transfer-from-safe')?.value;
  const toId = document.getElementById('transfer-to-safe')?.value;
  const amount = Math.max(0, Number(document.getElementById('transfer-amount')?.value) || 0);

  if (!fromId || !toId || fromId === toId) {
    showToast('يرجى اختيار قاصتين مختلفتين');
    return;
  }
  if (amount <= 0) return;

  const fromSafe = AppState.db.safes.find(s => s.id === fromId);
  const toSafe = AppState.db.safes.find(s => s.id === toId);
  const nowStr = formatDateTimeDisplay(getLocalDateTimeValue(0));
  const baseCode = Date.now().toString().slice(-5);

  AppState.db.transactions.unshift(
    {
      id: 'TRX-' + baseCode + 'B',
      type: 'receipt',
      safeId: toId,
      amount,
      party: fromSafe?.name || 'تحويل داخلي',
      description: `تحويل وارد من ${fromSafe?.name || ''}`,
      date: nowStr
    },
    {
      id: 'TRX-' + baseCode + 'A',
      type: 'payment',
      safeId: fromId,
      amount,
      party: toSafe?.name || 'تحويل داخلي',
      description: `تحويل صادر إلى ${toSafe?.name || ''}`,
      date: nowStr
    }
  );

  saveDatabase();
  closeModal();
  showToast('تم تحويل المبلغ بين القاصتين بنجاح');
  switchTab('accounting');
}

function getContactMovements(contact) {
  ensureAccountingStructures(AppState.db);
  if (!contact) {
    return {
      jobs: [],
      contracts: [],
      invoices: [],
      transactions: [],
      installmentPlans: [],
      totalReceipts: 0,
      totalPayments: 0,
      totalExpenses: 0,
      totalInvoiced: 0,
      totalRemainingOnJobs: 0,
      totalInstallmentsRemaining: 0,
      totalCount: 0,
      matchedRefs: []
    };
  }

  const cId = (contact.id || '').trim();
  const cName = (contact.name || '').trim();
  const cPhone = (contact.phone || '').trim();
  const cPlate = (contact.defaultPlate || '').trim();
  const cRef = (contact.refNumber || '').trim();

  const matchesContact = (itemCustomerId, itemName, itemPhone, itemPlate) => {
    if (cId && itemCustomerId && itemCustomerId === cId) return true;
    if (cName && itemName && itemName.trim() === cName) return true;
    if (cPhone && itemPhone && itemPhone.trim() === cPhone) return true;
    if (cPlate && itemPlate && itemPlate.trim() === cPlate) return true;
    return false;
  };

  const jobs = (AppState.db.jobCards || []).filter(j =>
    matchesContact(j.customerId, j.customerName, j.customerPhone, j.plateNumber)
  );
  const jobIds = new Set(jobs.map(j => j.id));

  const contracts = (AppState.db.trafficContracts || []).filter(tc =>
    matchesContact(tc.customerId, tc.buyerName, tc.buyerPhone, tc.plateNumber) ||
    (cName && tc.sellerName && tc.sellerName.trim() === cName) ||
    (tc.jobId && jobIds.has(tc.jobId)) ||
    (cRef && (tc.contractNumber === cRef || tc.id === cRef))
  );

  const invoices = (AppState.db.invoices || []).filter(inv =>
    matchesContact(inv.customerId, inv.customerName, inv.customerPhone, inv.plateNumber) ||
    (inv.jobCardId && jobIds.has(inv.jobCardId))
  );

  const transactions = (AppState.db.transactions || []).filter(tx =>
    (cName && tx.party && tx.party.trim() === cName) ||
    (cId && tx.contactId && tx.contactId === cId) ||
    (cPhone && tx.description && tx.description.includes(cPhone)) ||
    (cRef && tx.description && tx.description.includes(cRef))
  );

  const installmentPlans = (AppState.db.installmentPlans || []).filter(pl =>
    matchesContact(pl.customerId, pl.customerName, pl.customerPhone, pl.plateNumber)
  );
  const totalInstallmentsRemaining = installmentPlans.reduce((sum, pl) => sum + getInstallmentPlanStats(pl).remaining, 0);

  const totalReceipts = transactions
    .filter(tx => tx.type === 'receipt')
    .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
  const totalPayments = transactions
    .filter(tx => tx.type === 'payment')
    .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);
  const totalExpenses = transactions
    .filter(tx => tx.type === 'expense')
    .reduce((sum, tx) => sum + (Number(tx.amount) || 0), 0);

  let totalInvoiced = 0;
  let totalRemainingOnJobs = 0;
  jobs.forEach(j => {
    const t = calcJobTotals(j);
    totalInvoiced += t.total;
    totalRemainingOnJobs += t.remaining;
  });

  const matchedRefs = [
    cId,
    cRef,
    cPhone,
    cPlate,
    ...jobs.map(j => j.id),
    ...jobs.map(j => j.plateNumber),
    ...jobs.map(j => j.vin),
    ...jobs.map(j => j.trafficContract),
    ...contracts.map(tc => tc.contractNumber),
    ...contracts.map(tc => tc.id),
    ...contracts.map(tc => tc.plateNumber),
    ...contracts.map(tc => tc.vin),
    ...invoices.map(inv => inv.id),
    ...transactions.map(tx => tx.id),
    ...installmentPlans.map(pl => pl.id),
    ...installmentPlans.flatMap(pl => (pl.schedule || []).map(it => it.promissoryNo))
  ].filter(Boolean);

  return {
    jobs,
    contracts,
    invoices,
    transactions,
    installmentPlans,
    totalReceipts,
    totalPayments,
    totalExpenses,
    totalInvoiced,
    totalRemainingOnJobs,
    totalInstallmentsRemaining,
    totalCount: jobs.length + contracts.length + invoices.length + transactions.length + installmentPlans.length,
    matchedRefs
  };
}

function contactMatchesUniversalQuery(contact, rawQuery) {
  if (!rawQuery) return { matched: true, reason: '' };
  const q = rawQuery.trim().toLowerCase();
  if (!q) return { matched: true, reason: '' };

  const mov = getContactMovements(contact);

  if ((contact.name || '').toLowerCase().includes(q)) return { matched: true, reason: `الاسم: ${contact.name}` };
  if ((contact.phone || '').toLowerCase().includes(q)) return { matched: true, reason: `الهاتف: ${contact.phone}` };
  if ((contact.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم جهة الاتصال: ${contact.id}` };
  if ((contact.refNumber || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم المرجع/العقد: ${contact.refNumber}` };
  if ((contact.defaultPlate || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم اللوحة: ${contact.defaultPlate}` };
  if ((contact.defaultVehicle || '').toLowerCase().includes(q)) return { matched: true, reason: `السيارة: ${contact.defaultVehicle}` };

  for (const tc of mov.contracts) {
    if ((tc.contractNumber || '').toLowerCase().includes(q) || (tc.id || '').toLowerCase().includes(q)) {
      return { matched: true, reason: `رقم العقد المروري: ${tc.contractNumber || tc.id}` };
    }
    if ((tc.plateNumber || '').toLowerCase().includes(q) || (tc.vin || '').toLowerCase().includes(q) || (tc.contractText || '').toLowerCase().includes(q)) {
      return { matched: true, reason: `عقد مروري (${tc.contractNumber || tc.id})` };
    }
  }

  for (const j of mov.jobs) {
    if ((j.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم أمر العمل: ${j.id}` };
    if ((j.plateNumber || '').toLowerCase().includes(q)) return { matched: true, reason: `لوحة المركبة: ${j.plateNumber}` };
    if ((j.vin || '').toLowerCase().includes(q)) return { matched: true, reason: `الشاصي: ${j.vin}` };
    if ((j.trafficContract || '').toLowerCase().includes(q)) return { matched: true, reason: `العقد المروري بأمر العمل: ${j.id}` };
    if ((j.vehicleTitle || '').toLowerCase().includes(q) || (j.complaint || '').toLowerCase().includes(q)) {
      return { matched: true, reason: `أمر عمل (${j.id})` };
    }
  }

  for (const inv of mov.invoices) {
    if ((inv.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم الفاتورة: ${inv.id}` };
  }

  for (const tx of mov.transactions) {
    if ((tx.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم السند المالي: ${tx.id}` };
    if ((tx.description || '').toLowerCase().includes(q) || String(tx.amount || '').includes(q)) {
      return { matched: true, reason: `حركة مالية (${tx.id})` };
    }
  }

  for (const pl of (mov.installmentPlans || [])) {
    if ((pl.id || '').toLowerCase().includes(q)) return { matched: true, reason: `رقم عقد الأقساط: ${pl.id}` };
    if ((pl.guarantorName || '').toLowerCase().includes(q) || (pl.itemDescription || '').toLowerCase().includes(q)) {
      return { matched: true, reason: `عقد أقساط (${pl.id})` };
    }
    const matchedKmb = (pl.schedule || []).find(it => (it.promissoryNo || '').toLowerCase().includes(q));
    if (matchedKmb) return { matched: true, reason: `رقم الكمبيالة: ${matchedKmb.promissoryNo}` };
  }

  return { matched: false, reason: '' };
}

function updateContactUniversalSearch(val) {
  contactUniversalSearchQuery = val || '';
  const container = document.getElementById('main-view-container');
  if (!container || AppState.activeTab !== 'customers') return;
  container.innerHTML = renderCustomersView();
  if (typeof lucide !== 'undefined') lucide.createIcons();
  const input = document.getElementById('contact-universal-search-input');
  if (input) {
    input.focus();
    const len = input.value.length;
    input.setSelectionRange(len, len);
  }
}

function showContactStatement(contactId) {
  selectedContactStatementId = contactId;
  switchTab('customers');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function clearSelectedContactStatement() {
  selectedContactStatementId = '';
  contactUniversalSearchQuery = '';
  switchTab('customers');
}

function createContactRecord({ name, phone, refNumber, type, defaultVehicle, defaultPlate }) {
  const newContact = {
    id: 'CNT-' + Date.now().toString().slice(-6),
    name,
    phone,
    refNumber: refNumber || '',
    type: type || 'زبون',
    defaultVehicle: defaultVehicle || '',
    defaultPlate: defaultPlate || '',
    city: 'بغداد',
    totalVisits: 0,
    loyaltyPoints: 0,
    lifetimePoints: 0,
    loyaltyHistory: [],
    balance: 0,
    notes: ''
  };
  if (!Array.isArray(AppState.db.customers)) AppState.db.customers = [];
  AppState.db.customers.unshift(newContact);
  saveDatabase();
  return newContact;
}

function onBillingContactChange(contactId) {

  if (contact && vehEl && contact.defaultVehicle) {

  }
  const slot = document.getElementById('bill-vip-loyalty-slot');
  if (slot) {
    slot.innerHTML = contact ? renderLoyaltyBannerForForm(contact, 'bill') : '';
  }
  updateBillingLoyaltyPreview();
}

function updateBillingLoyaltyPreview() {
  const contactId = document.getElementById('bill-contact-select')?.value || '';
  const contact = (AppState.db.customers || []).find(c => c.id === contactId);
  const previewEl = document.getElementById('bill-vip-net-preview');
  if (!contact || !previewEl) return;

  const rawAmount = Math.max(0, Number(document.getElementById('bill-total-amount')?.value) || 0);
  if (rawAmount <= 0) {
    previewEl.innerHTML = '';
    return;
  }

  const loy = getCustomerLoyaltyInfo(contact);
  const applyVip = !!document.getElementById('bill-apply-vip-discount')?.checked;
  const redeemFree = !!document.getElementById('bill-redeem-free-points')?.checked;

  let discount = 0;
  if (redeemFree && loy.canRedeemFree) {
    discount = rawAmount;
  } else if (applyVip && loy.autoDiscountPct > 0) {
    discount = Math.round(rawAmount * (loy.autoDiscountPct / 100));
  }
  const net = Math.max(0, rawAmount - discount);

  if (discount > 0) {
    previewEl.innerHTML = `💰 الخصم: <span class="text-rose-600">-${formatCurrency(discount)}</span> | الصافي للدفع: <span class="text-emerald-700">${formatCurrency(net)}</span>`;
  } else {
    previewEl.innerHTML = `💰 الصافي للدفع: ${formatCurrency(net)}`;
  }
}

function submitDirectContactInvoice(e) {
  e.preventDefault();
  const contactId = document.getElementById('bill-contact-select')?.value || '';
  const contact = (AppState.db.customers || []).find(c => c.id === contactId);

  if (!contact) {
    showToast('⚠️ لا يمكن إنشاء فاتورة إلا بعد اختيار الزبون من جهات الاتصال!');
    openQuickAddContactModal('billing');
    return;
  }

  const vehicleInfo = document.getElementById('bill-vehicle-info')?.value.trim() || contact.defaultVehicle || 'مركبة';
  const rawTotalAmount = Math.max(0, Number(document.getElementById('bill-total-amount')?.value) || 0);
  const safeId = document.getElementById('bill-safe-select')?.value || AppState.db.safes?.[0]?.id || 'SAFE-01';
  const serviceDesc = document.getElementById('bill-service-desc')?.value.trim() || 'خدمات صيانة';
  const trafficContract = document.getElementById('bill-traffic-contract')?.value.trim() || '';

  if (rawTotalAmount <= 0) {
    showToast('يرجى إدخال مبلغ الفاتورة');
    return;
  }

  const nowStr = formatDateTimeDisplay(getLocalDateTimeValue(0));
  const newJobId = 'JC-' + Date.now().toString().slice(-6);
  const safeObj = (AppState.db.safes || []).find(s => s.id === safeId);

  // Loyalty & VIP Auto-Discount Calculation
  const loyBefore = getCustomerLoyaltyInfo(contact);
  const applyVipChecked = !!document.getElementById('bill-apply-vip-discount')?.checked;
  const redeemFreeChecked = !!document.getElementById('bill-redeem-free-points')?.checked;

  let discount = 0;
  let loyaltyDiscountLabel = '';
  let loyaltyRedeemedNow = false;

  if (redeemFreeChecked && loyBefore.canRedeemFree) {
    discount = rawTotalAmount;
    loyaltyDiscountLabel = `🎁 مكافأة استبدال ${loyBefore.freeEvery} نقاط (خدمة مجانية 100%)`;
    loyaltyRedeemedNow = redeemCustomerLoyaltyPoints(contact, loyBefore.freeEvery, `استبدال نقاط بخدمة مجانية — فاتورة ${newJobId}`);
  } else if (applyVipChecked && loyBefore.autoDiscountPct > 0) {
    discount = Math.round(rawTotalAmount * (loyBefore.autoDiscountPct / 100));
    loyaltyDiscountLabel = `${loyBefore.tier.icon} خصم ${loyBefore.tier.label} تلقائي (${loyBefore.autoDiscountPct}%)`;
  }

  const finalNetAmount = Math.max(0, rawTotalAmount - discount);

  const newJob = {
    id: newJobId,
    createdAt: nowStr,
    receivedAt: nowStr,
    deliveryAt: nowStr,
    signatureText: contact.name,
    signatureImage: null,
    vehicleId: 'VEH-' + Date.now().toString().slice(-6),
    plateNumber: contact.defaultPlate || '',
    vehicleTitle: vehicleInfo,
    vin: 'SKS-' + Math.floor(100000 + Math.random() * 900000),
    customerId: contact.id,
    customerName: contact.name,
    customerPhone: contact.phone || '',
    mileageIn: 0,
    fuelLevel: '50%',
    bayId: 'BAY-01',
    technicianName: 'مركز SKS Car',
    status: 'ready',
    priority: 'عادي',
    complaint: serviceDesc,
    diagnosis: serviceDesc,
    trafficContract,
    services: [{ name: serviceDesc, price: rawTotalAmount }],
    parts: [],
    discount,
    loyaltyDiscountLabel,
    loyaltyRedeemed: loyaltyRedeemedNow,
    vipTier: loyBefore.tier.label,
    vipDiscountPct: applyVipChecked && !loyaltyRedeemedNow ? loyBefore.autoDiscountPct : 0,
    paidAmount: finalNetAmount,
    paymentStatus: 'paid'
  };

  if (trafficContract) {
    ensureAccountingStructures(AppState.db);
    AppState.db.trafficContracts.unshift({
      id: 'TC-' + Date.now().toString().slice(-6),
      contractNumber: 'MR-' + Date.now().toString().slice(-5),
      date: nowStr,
      customerId: contact.id,
      sellerName: 'مركز SKS Car / الطرف الأول',
      buyerName: contact.name,
      buyerPhone: contact.phone || '',
      vehicleTitle: vehicleInfo,
      plateNumber: contact.defaultPlate || '',
      vin: newJob.vin,
      amount: finalNetAmount,
      contractText: trafficContract,
      jobId: newJobId
    });
  }

  AppState.db.jobCards.unshift(newJob);

  AppState.db.invoices.unshift({
    id: 'INV-' + Date.now().toString().slice(-6),
    jobCardId: newJob.id,
    customerId: contact.id,
    date: nowStr,
    customerName: contact.name,
    plateNumber: contact.defaultPlate || '',
    vehicleTitle: vehicleInfo,
    subtotal: rawTotalAmount,
    discount,
    loyaltyDiscountLabel,
    total: finalNetAmount,
    paid: finalNetAmount,
    method: loyaltyRedeemedNow ? '🎁 استبدال نقاط ولاء' : (safeObj ? safeObj.name : 'نقدي'),
    status: loyaltyRedeemedNow ? '🎁 مجانية (نقاط ولاء)' : 'مدفوعة بالكامل'
  });

  ensureAccountingStructures(AppState.db);
  if (finalNetAmount > 0) {
    AppState.db.transactions.unshift({
      id: 'TRX-' + Date.now().toString().slice(-6),
      type: 'receipt',
      safeId,
      contactId: contact.id,
      amount: finalNetAmount,
      party: contact.name,
      description: `فاتورة صيانة (${serviceDesc}) — ${vehicleInfo}${discount > 0 ? ` [${loyaltyDiscountLabel}]` : ''}`,
      date: nowStr
    });
  }

  contact.totalVisits = (Number(contact.totalVisits) || 0) + 1;
  if (!loyaltyRedeemedNow) {
    awardCustomerLoyaltyPoints(contact, loyBefore.cfg.pointsPerVisit, `فاتورة صيانة (${newJobId})`);
  }
  const loyAfter = getCustomerLoyaltyInfo(contact);

  preselectedContactId = '';
  saveDatabase();
  showToast(
    loyaltyRedeemedNow
      ? `🎁 تم إصدار فاتورة مجانية باستبدال النقاط للزبون (${contact.name}) | الرصيد المتبقي: ${loyAfter.points} ⭐`
      : `تم إصدار الفاتورة للزبون (${contact.name}) ${discount > 0 ? `بخصم VIP (-${formatCurrency(discount)}) ` : ''}| رصيد النقاط: ${loyAfter.points} ⭐`
  );
  switchTab('billing');
}

function saveJobTrafficContract(jobId) {
  const job = AppState.db.jobCards.find(j => j.id === jobId);
  if (!job) return;
  const val = document.getElementById('modal-traffic-contract')?.value.trim() || '';
  job.trafficContract = val;

  ensureAccountingStructures(AppState.db);
  if (val) {
    const existing = AppState.db.trafficContracts.find(tc => tc.jobId === jobId);
    if (existing) {
      existing.contractText = val;
    } else {
      const totals = calcJobTotals(job);
      AppState.db.trafficContracts.unshift({
        id: 'TC-' + Date.now().toString().slice(-6),
        contractNumber: 'MR-' + Date.now().toString().slice(-5),
        date: formatDateTimeDisplay(getLocalDateTimeValue(0)),
        sellerName: 'مركز SKS Car / الطرف الأول',
        buyerName: job.customerName,
        buyerPhone: job.customerPhone || '',
        vehicleTitle: job.vehicleTitle,
        plateNumber: job.plateNumber,
        vin: job.vin || '',
        amount: totals.total,
        contractText: val,
        jobId: job.id
      });
    }
  }
  saveDatabase();
  showToast('تم حفظ العقد المروري للمركبة بنجاح');
}

function submitTrafficContract(e) {
  e.preventDefault();
  ensureAccountingStructures(AppState.db);

  const buyerContactId = document.getElementById('tc-buyer-select')?.value || '';
  const contractNumber = document.getElementById('tc-contract-number')?.value.trim() || ('MR-' + Date.now().toString().slice(-5));
  const sellerName = document.getElementById('tc-seller-name')?.value.trim() || 'الطرف الأول';
  const buyerName = document.getElementById('tc-buyer-name')?.value.trim() || 'الطرف الثاني';
  const buyerPhone = document.getElementById('tc-buyer-phone')?.value.trim() || '';
  const vehicleTitle = document.getElementById('tc-vehicle-title')?.value.trim() || '';
  const plateNumber = document.getElementById('tc-plate-number')?.value.trim() || '';
  const vin = document.getElementById('tc-vin')?.value.trim() || '';
  const amount = Math.max(0, Number(document.getElementById('tc-amount')?.value) || 0);
  const contractText = document.getElementById('tc-contract-text')?.value.trim() || '';

  if (!contractText) {
    showToast('يرجى كتابة نص وبنود العقد المروري');
    return;
  }

  const newContract = {
    id: 'TC-' + Date.now().toString().slice(-6),
    contractNumber,
    date: formatDateTimeDisplay(getLocalDateTimeValue(0)),
    customerId: buyerContactId,
    sellerName,
    buyerName,
    buyerPhone,
    vehicleTitle,
    plateNumber,
    vin,
    amount,
    contractText,
    attachments: JSON.parse(JSON.stringify(contractFormAttachments || []))
  };

  AppState.db.trafficContracts.unshift(newContract);
  contractFormAttachments = [];
  saveDatabase();
  showToast('تم حفظ العقد المروري وصور المستمسكات بنجاح');
  switchTab('contracts');
}

function renderPrintableCarDiagramDocument(docData) {
  const printArea = document.getElementById('printable-document-area');
  if (!printArea) return;

  const damages = docData.bodyDamages || [];
  const services = docData.services || [];
  const parts = docData.parts || [];
  const attachments = docData.attachments || [];
  const bodyType = docData.vehicleBodyType || detectVehicleBodyTypeFromTitle(docData.vehicleTitle);
  const bodyTypeLabel = (VEHICLE_BODY_TYPES_META[bodyType] || VEHICLE_BODY_TYPES_META.sedan).label;

  const contact = (AppState.db.customers || []).find(c =>
    (docData.customerId && c.id === docData.customerId) ||
    (docData.customerName && c.name === docData.customerName)
  );
  const loyInfo = contact ? getCustomerLoyaltyInfo(contact) : null;
  const totalPages = attachments.length > 0 ? 3 : 2;
  const subtotalVal = services.reduce((s, x) => s + (Number(x.price) || 0), 0) + parts.reduce((s, p) => s + ((Number(p.qty) || 1) * (Number(p.unitPrice) || 0)), 0);
  const discountVal = Number(docData.discount) || 0;
  const totalVal = docData.total !== undefined
    ? docData.total
    : Math.max(0, subtotalVal - discountVal);
  const paidVal = Number(docData.paidAmount) || 0;
  const remainingVal = Math.max(0, totalVal - paidVal);

  printArea.innerHTML = `
    <!-- ====================================================================
         الصفحة الأولى (1): تفاصيل الزبون وبيانات الاستلام والخدمات
         ==================================================================== -->
    <div class="print-doc-shell">
      <div class="print-header-bar flex items-center justify-between">
        <div>${renderSksLogo('print')}</div>
        <div style="text-align: left;">
          <div style="font-size: 15.5pt; font-weight: 900; color: #00E5FF;">تفاصيل الزبون واستمارة الاستلام</div>

function printCarBodyDiagramReport(jobId) {
  const job = AppState.db.jobCards.find(j => j.id === jobId) || AppState.db.jobCards[0];
  if (!job) {
    showToast('لا توجد سيارة مسجلة للطباعة');
    return;
  }
  const totals = calcJobTotals(job);
  renderPrintableCarDiagramDocument({
    ...job,
    total: totals.total
  });
}

function printCurrentReceptionDiagram() {
  const contactId = document.getElementById('rec-contact-select')?.value || '';
  const contact = (AppState.db.customers || []).find(c => c.id === contactId);
  const customerName = contact ? contact.name : (document.getElementById('rec-signature-text')?.value.trim() || 'غير محدد');
  const customerPhone = contact?.phone || document.getElementById('rec-customer-phone')?.value.trim() || '—';
  const vehicleTitle = document.getElementById('rec-vehicle-title')?.value.trim() || 'مركبة قيد الاستلام';
  const plateNumber = document.getElementById('rec-plate-number')?.value.trim() || '—';
  const mileageIn = Number(document.getElementById('rec-mileage')?.value) || 0;
  const receivedAt = document.getElementById('rec-received-at')?.value || getLocalDateTimeValue(0);
  const deliveryAt = document.getElementById('rec-delivery-at')?.value || getLocalDateTimeValue(3);
  const nextServiceDate = document.getElementById('rec-next-service-date')?.value || '';
  const nextServiceKm = Number(document.getElementById('rec-next-service-km')?.value) || 0;
  const nextServiceNote = document.getElementById('rec-next-service-note')?.value.trim() || 'تبديل دهن وفلتر وفحص دوري';
  const complaint = document.getElementById('rec-complaint')?.value.trim() || '';
  const trafficContract = document.getElementById('rec-traffic-contract')?.value.trim() || '';
  const signatureText = document.getElementById('rec-signature-text')?.value.trim() || customerName;
  const canvas = document.getElementById('customer-signature-canvas');
  const signatureImage = (canvas && sigCanvasState.hasDrawn) ? canvas.toDataURL('image/png') : null;

  const selectedServiceIds = Array.from(document.querySelectorAll('input[name="rec-services"]:checked')).map(el => el.value);
  const services = (AppState.db.serviceCatalog || [])
    .filter(s => selectedServiceIds.includes(s.id))
    .map(s => {
      const customPriceEl = document.getElementById('rec-srv-price-' + s.id);
      const finalPrice = customPriceEl ? (Number(customPriceEl.value) || 0) : s.price;
      return { name: s.name, price: finalPrice };
    });

  const customOpName = document.getElementById('rec-custom-op-name')?.value.trim();
  const customOpPrice = Number(document.getElementById('rec-custom-op-price')?.value) || 0;
  if (customOpName) {
    services.push({ name: customOpName, price: customOpPrice });
  }

  const total = services.reduce((sum, s) => sum + (Number(s.price) || 0), 0);

  renderPrintableCarDiagramDocument({
    id: 'INSP-' + Date.now().toString().slice(-6),
    createdAt: formatDateTimeDisplay(receivedAt),
    receivedAt,
    deliveryAt,
    customerId: contactId,
    customerName,
    customerPhone,
    vehicleTitle,
    plateNumber,
    mileageIn,
    nextServiceDate,
    nextServiceKm,
    nextServiceNote,
    complaint,
    trafficContract,
    vehicleBodyType: selectedVehicleBodyType,
    bodyDamages: receptionBodyDamages || [],
    attachments: receptionAttachments || [],
    services,
    total,
    paidAmount: 0,
    signatureText,
    signatureImage
  });
}

function sendWhatsAppToCustomer(jobId) {
  const job = AppState.db.jobCards.find(j => j.id === jobId) || AppState.db.jobCards[0];
  if (!job) return;
  const totals = calcJobTotals(job);
  const st = JOB_STATUS_META[job.status]?.label || 'قيد العمل';
  const recTime = formatDateTimeDisplay(job.receivedAt || job.createdAt);
  const delTime = formatDateTimeDisplay(job.deliveryAt || 'نفس اليوم');

  let phone = (job.customerPhone || '').replace(/[^0-9]/g, '');
  if (phone.startsWith('07')) {
    phone = '964' + phone.substring(1);
  }

  const servicesList = (job.services || []).map(s => `• ${s.name}: ${formatCurrency(s.price)}`).join('\n');
  const contact = (AppState.db.customers || []).find(c =>
    (job.customerId && c.id === job.customerId) ||
    (job.customerName && c.name === job.customerName)
  );
  const loy = contact ? getCustomerLoyaltyInfo(contact) : null;
  const loyaltyLine = loy
    ? `\n⭐ *رصيد نقاط الولاء:* ${loy.points} نقطة (${loy.tier.icon} ${loy.tier.label}) — ${loy.canRedeemFree ? '🎁 لديك خدمة مجانية جاهزة للاستبدال!' : `باقي ${loy.visitsRemainingForFree} زيارة للخدمة المجانية القادمة`}`
    : '';
  const discountLine = totals.discount > 0 ? `👑 *الخصم (${job.loyaltyDiscountLabel || 'VIP'}):* -${formatCurrency(totals.discount)}\n` : '';

  const msg = `*نظام SKS Car لإدارة خدمات السيارات* 🚗\n` +
    `مرحباً أستاذ *${job.customerName}*\n` +
    `━━━━━━━━━━━━━━\n` +
    `🔹 *السيارة:* ${job.vehicleTitle} (${job.plateNumber})\n` +
    `🔹 *رقم الأمر:* ${job.id}\n` +
    `🔹 *الحالة:* ${st}\n` +
    `⏱ *موعد الاستلام:* ${recTime}\n` +
    `📅 *موعد التسليم:* ${delTime}\n` +
    `━━━━━━━━━━━━━━\n` +
    `*الخدمات المسجلة:*\n${servicesList || '• فحص وصيانة'}\n` +
    `━━━━━━━━━━━━━━\n` +
    discountLine +
    `💰 *الإجمالي الصافي:* ${formatCurrency(totals.total)}\n` +
    `✅ *المدفوع:* ${formatCurrency(totals.paid)}\n` +
    `📌 *المتبقي:* ${formatCurrency(totals.remaining)}` +
    loyaltyLine + `\n` +
    `━━━━━━━━━━━━━━\n` +
    `شكراً لاختياركم *SKS Car*`;

  const waUrl = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
  window.open(waUrl, '_blank');
}

function exportBackupData() {
  const jsonStr = JSON.stringify(AppState.db, null, 2);
  const blob = new Blob([jsonStr], { type: 'application/json;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `sks-car-data-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  showToast('تم تحميل ملف البيانات لنقله إلى الحاسبة الأخرى');
}

function importBackupData(event) {
  const file = event.target.files?.[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const parsed = JSON.parse(e.target.result);
      AppState.db = Object.assign({}, JSON.parse(JSON.stringify(INITIAL_SKS_DATA)), parsed);
      AppState.db.brand = SKS_BRAND;
      saveDatabase();
      switchTab('dashboard');
      showToast('تم استرجاع جميع البيانات بنجاح!');
    } catch (err) {
      showToast('الملف غير صالح');
    }
  };
  reader.readAsText(file);
}

/* ==========================================================================
   11. FLOATING MINI CALCULATOR (أيقونة الحاسبة السريعة في أسفل الشاشة)
   ========================================================================== */
let miniCalcExpr = '';
let miniCalcJustEvaluated = false;

function toggleMiniCalculator(forceState) {
  const popup = document.getElementById('mini-calc-popup');
  if (!popup) return;
  const isHidden = popup.classList.contains('hidden');
  const nextShow = typeof forceState === 'boolean' ? forceState : isHidden;

  if (nextShow) {
    popup.classList.remove('hidden');
    if (typeof lucide !== 'undefined') lucide.createIcons();
  } else {
    popup.classList.add('hidden');
  }
}

function updateMiniCalcScreen(mainVal, subExpr) {
  const dispEl = document.getElementById('mini-calc-display');
  const exprEl = document.getElementById('mini-calc-expr');
  if (dispEl) {
    const num = Number(mainVal);
    if (mainVal !== '' && !isNaN(num) && !String(mainVal).endsWith('.')) {
      dispEl.textContent = num.toLocaleString('en-US', { maximumFractionDigits: 4 });
    } else {
      dispEl.textContent = mainVal || '0';
    }
  }
  if (exprEl) {
    exprEl.innerHTML = subExpr ? subExpr.replace(/\*/g, '×').replace(/\//g, '÷') : '&nbsp;';
  }
}

function calcInput(token) {
  const ops = ['+', '-', '*', '/'];

  if (token === 'C') {
    miniCalcExpr = '';
    miniCalcJustEvaluated = false;
    updateMiniCalcScreen('0', '');
    return;
  }

  if (token === 'BACK') {
    if (miniCalcJustEvaluated) {
      miniCalcExpr = '';
      miniCalcJustEvaluated = false;
      updateMiniCalcScreen('0', '');
      return;
    }
    miniCalcExpr = miniCalcExpr.slice(0, -1);
    updateMiniCalcScreen(miniCalcExpr || '0', miniCalcExpr);
    return;
  }

  if (token === '=') {
    if (!miniCalcExpr) return;
    try {
      const sanitized = miniCalcExpr.replace(/[^0-9+\-*/.]/g, '');
      const result = Function(`"use strict"; return (${sanitized})`)();
      if (typeof result === 'number' && isFinite(result)) {
        const rounded = Math.round(result * 10000) / 10000;
        updateMiniCalcScreen(String(rounded), `${miniCalcExpr} =`);
        miniCalcExpr = String(rounded);
        miniCalcJustEvaluated = true;
      }
    } catch (e) {
      updateMiniCalcScreen('خطأ', miniCalcExpr);
      miniCalcExpr = '';
    }
    return;
  }

  if (ops.includes(token)) {
    miniCalcJustEvaluated = false;
    if (!miniCalcExpr) {
      if (token === '-') {
        miniCalcExpr = '-';
        updateMiniCalcScreen('-', '-');
      }
      return;
    }
    const lastChar = miniCalcExpr.slice(-1);
    if (ops.includes(lastChar)) {
      miniCalcExpr = miniCalcExpr.slice(0, -1) + token;
    } else {
      miniCalcExpr += token;
    }
    updateMiniCalcScreen(miniCalcExpr.split(/[+\-*/]/).pop() || '0', miniCalcExpr);
    return;
  }

  // Number or '000' or '.'
  if (miniCalcJustEvaluated) {
    miniCalcExpr = '';
    miniCalcJustEvaluated = false;
  }

  if (token === '000' && (!miniCalcExpr || ops.includes(miniCalcExpr.slice(-1)))) {
    return;
  }

  miniCalcExpr += token;
  const currentPart = miniCalcExpr.split(/[+\-*/]/).pop();
  updateMiniCalcScreen(currentPart || '0', miniCalcExpr);
}

function copyCalcResult() {
  const val = miniCalcExpr || '0';
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(val).then(() => {
      showToast(`تم نسخ الرقم: ${Number(val).toLocaleString('en-US')}`);
    }).catch(() => {});
  } else {
    showToast(`النتيجة: ${val}`);
  }
}

window.addEventListener('keydown', (e) => {
  const popup = document.getElementById('mini-calc-popup');
  if (!popup || popup.classList.contains('hidden')) return;
  const activeTag = document.activeElement?.tagName;
  if (activeTag === 'INPUT' || activeTag === 'TEXTAREA' || activeTag === 'SELECT') return;

  if (e.key >= '0' && e.key <= '9') {
    e.preventDefault();
    calcInput(e.key);
  } else if (['+', '-', '*', '/'].includes(e.key)) {
    e.preventDefault();
    calcInput(e.key);
  } else if (e.key === 'Enter' || e.key === '=') {
    e.preventDefault();
    calcInput('=');
  } else if (e.key === 'Backspace') {
    e.preventDefault();
    calcInput('BACK');
  } else if (e.key === 'Escape') {
    e.preventDefault();
    toggleMiniCalculator(false);
  } else if (e.key === '.') {
    e.preventDefault();
    calcInput('.');
  }
});

window.addEventListener('DOMContentLoaded', initApp);
